<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Delhi Iron Pillar and its protective layer</title>
  <desc id="desc">A schematic elevation of the pillar with its inscription band, and a magnified section showing the iron core and a thin phosphate film.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">DELHI IRON PILLAR</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">ELEVATION / SURFACE LAYER / SCHEMATIC</text>

  <g>
    <rect x="90" y="112" width="300" height="330" fill="#D9C6A5" opacity=".35"/>
    <path d="M220 140 L 260 140 L 260 390 L 220 390 Z" fill="#3E4A52"/>
    <path d="M220 140 L 240 126 L 260 140 Z" fill="#3E4A52"/>
    <rect x="200" y="390" width="80" height="18" fill="#2A333A"/>
    <rect x="186" y="408" width="108" height="12" fill="#1D1A17"/>
    <g fill="none" stroke="#D8C9AE" stroke-width="1.5" opacity=".75">
      <path d="M226 210 H 254 M226 218 H 254 M226 226 H 254 M226 234 H 254 M226 242 H 254 M226 250 H 254"/>
      <path d="M226 258 H 254 M226 266 H 254 M226 274 H 254"/>
    </g>
    <path d="M300 140 L 300 408" stroke="#B44A32" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M294 140 H 306 M294 408 H 306" stroke="#B44A32" stroke-width="1.5"/>
    <text x="314" y="270" font-family="Georgia, serif" font-size="12" fill="#B44A32">7.2 m</text>
    <text x="314" y="288" font-family="Georgia, serif" font-size="10" fill="#6B6256">about 6 tonnes</text>
    <text x="140" y="160" font-family="Georgia, serif" font-size="11" fill="#1D1A17">SANSKRIT</text>
    <text x="140" y="176" font-family="Georgia, serif" font-size="10" fill="#6B6256">梵文铭文</text>
  </g>

  <g>
    <circle cx="690" cy="250" r="96" fill="none" stroke="#1D1A17" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M610 250 L 770 250" stroke="#F3EEE4" stroke-width="1" opacity=".2"/>
    <circle cx="690" cy="250" r="68" fill="#3E4A52"/>
    <circle cx="690" cy="250" r="78" fill="none" stroke="#D99A2B" stroke-width="3"/>
    <g stroke="#F3EEE4" stroke-width="1" opacity=".25">
      <path d="M650 210 L 730 290"/>
      <path d="M730 210 L 650 290"/>
    </g>
    <text x="690" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#F3EEE4">IRON CORE</text>
    <text x="690" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">铁芯</text>
    <text x="690" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D99A2B">MISAWITE FILM</text>
    <text x="690" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6B6256">磷酸铁保护层</text>
    <path d="M770 250 L 810 250" stroke="#D99A2B" stroke-width="2"/>
    <circle cx="816" cy="250" r="4" fill="#D99A2B"/>
    <text x="792" y="270" font-family="Georgia, serif" font-size="10" fill="#6B6256">air + moisture</text>
    <text x="792" y="286" font-family="Georgia, serif" font-size="10" fill="#6B6256">空气与水分</text>
    <text x="560" y="380" font-family="Georgia, serif" font-size="11" fill="#1D1A17">A thin film, not a coating.</text>
    <text x="560" y="398" font-family="Georgia, serif" font-size="10" fill="#6B6256">不是涂层，而是一层很薄的保护膜。</text>
  </g>

  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <text x="60" y="462">Wrought iron · high phosphorus · low carbon · dry Delhi climate</text>
    <text x="60" y="480">熟铁 · 高磷 · 低碳 · 德里干燥气候</text>
    <text x="60" y="502">Not stainless steel / 不是不锈钢 · Graphic: XIQIQI · CC BY-SA 4.0</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
