<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Plan and section of Jiaohe</title>
  <desc id="desc">A schematic plan of the loess plateau between two rivers, with streets and buildings, plus a section showing rooms dug down from the surface.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">JIAOHE · EARTH-CUT CITY</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">PLAN / SECTION / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="480" height="300" fill="#EFE6D6"/>
    <path d="M60 180 C 130 160, 170 200, 220 190 S 330 150, 400 180 S 500 200, 540 180" fill="none" stroke="#6FA8C8" stroke-width="9" opacity=".55"/>
    <path d="M60 360 C 130 340, 170 380, 220 370 S 330 330, 400 360 S 500 380, 540 360" fill="none" stroke="#6FA8C8" stroke-width="9" opacity=".55"/>
    <text x="80" y="168" font-family="Georgia, serif" font-size="10" fill="#6B6256">RIVER / 河</text>
    <text x="80" y="390" font-family="Georgia, serif" font-size="10" fill="#6B6256">RIVER / 河</text>

    <path d="M190 210 C 220 190, 380 190, 420 220 C 450 260, 440 330, 400 350 C 350 370, 240 370, 200 340 C 180 300, 180 240, 190 210 Z" fill="#D9C6A5" stroke="#6B4A32" stroke-width="2"/>
    <path d="M300 210 L 300 350" stroke="#6B4A32" stroke-width="5"/>
    <path d="M230 260 H 400 M230 300 H 400" stroke="#6B4A32" stroke-width="2"/>
    <g fill="#B44A32">
      <rect x="250" y="222" width="24" height="18"/>
      <rect x="330" y="222" width="30" height="22"/>
      <rect x="250" y="312" width="28" height="20"/>
      <rect x="340" y="312" width="22" height="18"/>
    </g>
    <text x="308" y="278" font-family="Georgia, serif" font-size="10" fill="#1D1A17">CENTRAL AVENUE</text>
    <text x="308" y="292" font-family="Georgia, serif" font-size="10" fill="#1D1A17">中央大道</text>
    <text x="366" y="236" font-family="Georgia, serif" font-size="10" fill="#B44A32">TEMPLE</text>
    <text x="366" y="250" font-family="Georgia, serif" font-size="10" fill="#B44A32">寺院</text>
    <text x="180" y="430" font-family="Georgia, serif" font-size="10" fill="#6B6256">Plateau approx. 1.6 km long / 台地长约 1.6 公里</text>
  </g>

  <g>
    <rect x="580" y="112" width="260" height="300" fill="#EFE6D6" stroke="#1D1A17" stroke-opacity=".15"/>
    <text x="600" y="136" font-family="Georgia, serif" font-size="11" fill="#1D1A17">SECTION / 剖面</text>
    <path d="M600 200 H 820 V 320 H 600 Z" fill="#D9C6A5" stroke="#6B4A32" stroke-width="2"/>
    <path d="M640 200 L 640 300 L 700 300 L 700 200" fill="none" stroke="#6B4A32" stroke-width="2"/>
    <path d="M640 240 L 700 240" stroke="#6B4A32" stroke-width="1.5"/>
    <path d="M620 200 L 640 200 M700 200 L 720 200" stroke="#1D1A17" stroke-width="5"/>
    <text x="646" y="228" font-family="Georgia, serif" font-size="9" fill="#1D1A17">ROOM / 房间</text>
    <text x="646" y="272" font-family="Georgia, serif" font-size="9" fill="#1D1A17">COURTYARD / 院落</text>
    <text x="600" y="340" font-family="Georgia, serif" font-size="10" fill="#6B6256">Dug down from the surface</text>
    <text x="600" y="356" font-family="Georgia, serif" font-size="10" fill="#6B6256">从地面向下挖出生土建筑</text>
    <path d="M600 370 H 820" stroke="#1D1A17" stroke-width="1" opacity=".2"/>
    <text x="600" y="390" font-family="Georgia, serif" font-size="10" fill="#6B6256">LOESS / 黄土</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">No separate city wall: cliffs and river valleys formed the defence.</text>
    <text x="60" y="470">没有另筑城墙：断崖与河谷就是防线。</text>
    <text x="60" y="494" fill="#B44A32">UNESCO Silk Road site, 2014. / 2014 年列入丝绸之路世界遗产。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
