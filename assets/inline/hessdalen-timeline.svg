<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Hessdalen lights timeline</title>
  <desc id="desc">A schematic timeline of Hessdalen light observations from the 1930s to the present.</desc>
  <rect width="960" height="360" fill="#F3EEE4"/>
  <text x="60" y="60" font-family="Georgia, serif" font-size="26" fill="#1D1A17">HESSDALEN LIGHTS</text>
  <text x="60" y="84" font-family="Georgia, serif" font-size="12" fill="#6B6256">OBSERVATION TIMELINE / SCHEMATIC</text>
  <line x1="80" y1="220" x2="880" y2="220" stroke="#1D1A17" opacity=".4"/>
  <g fill="#B44A32">
    <circle cx="140" cy="220" r="7"/>
    <circle cx="360" cy="220" r="7"/>
    <circle cx="520" cy="220" r="7"/>
    <circle cx="680" cy="220" r="7"/>
    <circle cx="840" cy="220" r="7"/>
  </g>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="14">
    <text x="110" y="190">1930s</text>
    <text x="310" y="190">1981–1984</text>
    <text x="480" y="190">1983</text>
    <text x="650" y="190">1998</text>
    <text x="810" y="190">today</text>
  </g>
  <g font-family="Georgia, serif" fill="#6B6256" font-size="11">
    <text x="100" y="255">first reports</text>
    <text x="285" y="255">main wave</text>
    <text x="470" y="255">Project Hessdalen</text>
    <text x="640" y="255">automatic station</text>
    <text x="805" y="255">ongoing</text>
  </g>
  <text x="60" y="330" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
