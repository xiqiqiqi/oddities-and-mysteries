<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Slow Down spectrogram</title>
  <desc id="desc">A schematic spectrogram of the Slow Down sound, showing a descending frequency over about seven minutes.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="26" fill="#1D1A17">SLOW DOWN · 1997</text>
  <text x="60" y="82" font-family="Georgia, serif" font-size="12" fill="#6B6256">SPECTROGRAM / SCHEMATIC</text>
  <rect x="100" y="120" width="700" height="280" fill="#E7DEC9" stroke="#1D1A17" opacity=".35"/>
  <g stroke="#1D1A17" opacity=".12">
    <path d="M240 120 L 240 400"/><path d="M380 120 L 380 400"/><path d="M520 120 L 520 400"/><path d="M660 120 L 660 400"/>
    <path d="M100 190 L 800 190"/><path d="M100 260 L 800 260"/><path d="M100 330 L 800 330"/>
  </g>
  <path d="M140 170 C 220 190, 300 230, 380 270 S 520 330, 600 360 S 720 385, 790 392" fill="none" stroke="#D99A2B" stroke-width="5" stroke-linecap="round"/>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="13">
    <text x="100" y="440">0</text>
    <text x="410" y="440">~3.5 min</text>
    <text x="750" y="440">~7 min</text>
    <text x="815" y="270" transform="rotate(-90 815 270)">FREQUENCY / 频率</text>
    <text x="360" y="300" fill="#B44A32">frequency falls / 频率下降</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#6B6256">
    <text x="100" y="475">A long, descending call — later matched to an icequake.</text>
    <text x="100" y="495">一段持续约七分钟、频率不断下降的声音，后来被识别为冰震。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
