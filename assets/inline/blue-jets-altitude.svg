<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Blue jets and upper-atmospheric lightning</title>
  <desc id="desc">A cross-section of the atmosphere showing a thundercloud, a blue jet reaching about 45 kilometres, a red sprite, and an ELVES ring near 90 kilometres.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">ABOVE THE THUNDERSTORM</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">BLUE JETS / SPRITES / ELVES · SCHEMATIC</text>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#14243A"/>
      <stop offset="1" stop-color="#3A4A5A"/>
    </linearGradient>
  </defs>
  <rect x="60" y="104" width="780" height="340" fill="url(#sky)"/>

  <g stroke="#F3EEE4" stroke-width="1" stroke-dasharray="4 6" opacity=".25">
    <path d="M60 164 H840"/>
    <path d="M60 284 H840"/>
    <path d="M60 364 H840"/>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#F3EEE4" opacity=".8">
    <text x="72" y="158">90 km · ELVES</text>
    <text x="72" y="278">50 km · SPRITES</text>
    <text x="72" y="358">12 km · TROPOPAUSE</text>
    <text x="72" y="434">0 km · GROUND</text>
  </g>

  <g>
    <path d="M270 410 C 300 384, 340 378, 380 380 C 420 382, 455 392, 470 410 Z" fill="#0A0C10" stroke="#8FA0B0" stroke-width="1.5"/>
    <path d="M290 396 C 320 388, 350 394, 380 390" fill="none" stroke="#D99A2B" stroke-width="2" opacity=".7"/>
    <text x="300" y="430" font-family="Georgia, serif" font-size="11" fill="#D8D0C4">THUNDERCLOUD / 雷暴云</text>
  </g>

  <g>
    <path d="M380 380 L 372 230 L 382 230 L 392 380 Z" fill="#4FA8E8" opacity=".9"/>
    <path d="M380 380 L 372 230 L 382 230 L 392 380 Z" fill="none" stroke="#9FD4FF" stroke-width="1"/>
    <circle cx="382" cy="230" r="5" fill="#BFE3FF"/>
    <text x="404" y="236" font-family="Georgia, serif" font-size="12" fill="#9FD4FF">BLUE JET</text>
    <text x="404" y="253" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">蓝色喷流 · 约 40–50 km</text>
    <text x="404" y="270" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">持续数百毫秒</text>
  </g>

  <g>
    <g stroke="#C84A3A" stroke-width="2" fill="none" opacity=".85">
      <path d="M640 270 L 632 220 M640 270 L 646 214 M640 270 L 656 226 M640 270 L 624 232 M640 270 L 664 246"/>
    </g>
    <text x="676" y="232" font-family="Georgia, serif" font-size="12" fill="#E08A7A">RED SPRITE</text>
    <text x="676" y="249" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">红色精灵</text>
  </g>

  <g>
    <ellipse cx="700" cy="164" rx="76" ry="12" fill="none" stroke="#E0B36A" stroke-width="2" opacity=".8"/>
    <ellipse cx="700" cy="164" rx="110" ry="18" fill="none" stroke="#E0B36A" stroke-width="1" opacity=".4"/>
    <text x="700" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#E0B36A">ELVES RING</text>
  </g>

  <g fill="#F3EEE4" opacity=".8">
    <circle cx="160" cy="140" r="1.4"/>
    <circle cx="210" cy="190" r="1.2"/>
    <circle cx="120" cy="222" r="1.2"/>
    <circle cx="250" cy="150" r="1"/>
    <circle cx="780" cy="120" r="1.3"/>
    <circle cx="820" cy="200" r="1"/>
  </g>
  <text x="60" y="474" font-family="Georgia, serif" font-size="11" fill="#6B6256">Not to scale / 非精确比例 · Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
