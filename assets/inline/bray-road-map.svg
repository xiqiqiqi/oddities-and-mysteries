<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Beast of Bray Road: the sightings and the creature</title>
  <desc id="desc">A schematic map of Bray Road near Elkhorn, Wisconsin, with cornfields and sighting points, a list of the creature's features, and possible explanations.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">BEAST OF BRAY ROAD · WISCONSIN</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">1936 / 1989–1992 / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>

    <!-- cornfields -->
    <rect x="80" y="170" width="130" height="70" fill="#D8CCB6" stroke="#B8A582" stroke-width="1"/>
    <rect x="330" y="300" width="140" height="60" fill="#D8CCB6" stroke="#B8A582" stroke-width="1"/>
    <g stroke="#8C7A52" stroke-width="1">
      <path d="M90 180 V 230 M100 180 V 230 M110 180 V 230 M120 180 V 230 M130 180 V 230 M140 180 V 230 M150 180 V 230 M160 180 V 230 M170 180 V 230 M180 180 V 230 M190 180 V 230 M200 180 V 230"/>
      <path d="M340 310 V 350 M350 310 V 350 M360 310 V 350 M370 310 V 350 M380 310 V 350 M390 310 V 350 M400 310 V 350 M410 310 V 350 M420 310 V 350 M430 310 V 350 M440 310 V 350 M450 310 V 350"/>
    </g>

    <!-- roads -->
    <path d="M60 260 H 480" stroke="#8C7A52" stroke-width="9"/>
    <path d="M250 112 V 392" stroke="#8C7A52" stroke-width="7"/>
    <path d="M60 260 H 480" stroke="#F3EEE4" stroke-width="1.5" stroke-dasharray="8 8"/>

    <!-- town -->
    <g fill="#8C7A52">
      <rect x="100" y="318" width="12" height="10"/>
      <rect x="116" y="322" width="10" height="8"/>
      <rect x="130" y="316" width="14" height="12"/>
    </g>

    <!-- sightings -->
    <g fill="#B44A32">
      <circle cx="200" cy="255" r="5"/>
      <circle cx="300" cy="265" r="5"/>
      <circle cx="350" cy="250" r="5"/>
    </g>

    <g font-family="Georgia, serif" fill="#1D1A17">
      <text x="90" y="250" font-size="8">BRAY ROAD / 布雷路</text>
      <text x="90" y="342" font-size="8">ELKHORN / 埃尔克霍恩</text>
      <text x="350" y="294" font-size="8">cornfields / 玉米地</text>
    </g>

    <circle cx="90" cy="378" r="4" fill="#B44A32"/>
    <text x="102" y="381" font-family="Georgia, serif" font-size="8" fill="#6B6256">sighting / 目击</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CREATURE / 形象</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="168">6–7 ft upright / 站立 6–7 英尺</text>
      <text x="520" y="192">wolf head, amber eyes / 狼头，琥珀色眼睛</text>
      <text x="520" y="216">two or four legs / 两腿或四腿</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">EXPLANATIONS / 解释</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">bear standing upright / 站立的熊</text>
      <text x="520" y="334">coyote with mange / 患兽疥癣的郊狼</text>
      <text x="520" y="356">hoax or rumour / 恶作剧或传闻</text>
    </g>
    <text x="520" y="380" font-family="Georgia, serif" font-size="8" fill="#B44A32">no photograph or physical evidence / 没有照片或实物证据</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Reports clustered on Bray Road in the late 1980s and early 1990s.</text>
    <text x="60" y="470">目击集中在 1980 年代末到 1990 年代初的布雷路。</text>
    <text x="60" y="494" fill="#B44A32">Witnesses described a tall wolf-like creature that could stand upright. / 目击者描述了一个高大的、能站立的狼形生物。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
