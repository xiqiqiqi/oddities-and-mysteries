<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Owlman of Mawnan: sightings and afterlife, 1976 to 2013</title>
  <desc id="desc">Timeline: 17 April 1976 the Melling girls report a winged figure over the church tower; 1976 the Morgawr pamphlet circulates; 3 July 1976 two camping girls give a second account; 1978, 1979, 1989, 1995 sporadic reports; 2000 an owl-like sound at Mullion; 2009 Lost Tapes episode; 2012 stage play; 2013 film Lord of Tears.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
  <text x="60" y="62" font-family="Georgia, serif" font-size="26" fill="#1D1A17">OWLMAN · MAWNAN 1976–2013</text>
  <text x="60" y="86" font-family="Georgia, serif" font-size="12" fill="#6B6256">教堂塔顶的影子 · sightings and afterlife</text>

  <path d="M70 250 H 840" stroke="#6B4A32" stroke-width="2"/>
  <g font-family="Georgia, serif">
    <circle cx="90" cy="250" r="7" fill="#B44A32"/>
    <text x="66" y="222" font-size="11" fill="#1D1A17">1976-04-17</text>
    <text x="66" y="286" font-size="9" fill="#4A4030">梅林姐妹塔顶目击</text>
    <text x="66" y="300" font-size="8" fill="#6B6256">假期提前结束</text>

    <circle cx="200" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="180" y="222" font-size="11" fill="#1D1A17">1976</text>
    <text x="176" y="286" font-size="9" fill="#4A4030">Morgawr 小册子</text>
    <text x="176" y="300" font-size="8" fill="#6B6256">故事有了纸面载体</text>

    <circle cx="310" cy="250" r="7" fill="#B44A32"/>
    <text x="286" y="222" font-size="11" fill="#1D1A17">1976-07-03</text>
    <text x="286" y="286" font-size="9" fill="#4A4030">露营女孩第二份描述</text>
    <text x="286" y="300" font-size="8" fill="#6B6256">尖耳、钳爪、发光眼</text>

    <circle cx="430" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="400" y="222" font-size="11" fill="#1D1A17">1978–95</text>
    <text x="400" y="286" font-size="9" fill="#4A4030">零星目击四次</text>
    <text x="400" y="300" font-size="8" fill="#6B6256">78 / 79 / 89 / 95</text>

    <circle cx="540" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="520" y="222" font-size="11" fill="#1D1A17">2000</text>
    <text x="516" y="286" font-size="9" fill="#4A4030">穆利恩墓地夜声</text>
    <text x="516" y="300" font-size="8" fill="#6B6256">"像猫头鹰的叫声"</text>

    <circle cx="650" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="630" y="222" font-size="11" fill="#1D1A17">2009</text>
    <text x="626" y="286" font-size="9" fill="#4A4030">Lost Tapes 一集</text>
    <text x="626" y="300" font-size="8" fill="#6B6256">Death Raptor</text>

    <circle cx="740" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="720" y="222" font-size="11" fill="#1D1A17">2012</text>
    <text x="716" y="286" font-size="9" fill="#4A4030">舞台剧写入剧情</text>
    <text x="716" y="300" font-size="8" fill="#6B6256">Horse Piss for Blood</text>

    <circle cx="820" cy="250" r="7" fill="#B44A32"/>
    <text x="796" y="222" font-size="11" fill="#1D1A17">2013</text>
    <text x="780" y="286" font-size="9" fill="#4A4030">电影 Lord of Tears</text>
    <text x="780" y="300" font-size="8" fill="#6B6256">形象代表摩洛</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="400">解释候选：仓鸮（尼克尔）、雕鸮（范索普）、希尔尔斯恶作剧（梅德韦）。</text>
    <text x="60" y="418">Candidates: barn owl (Nickell), eagle-owl (Fanthorpe), a Shiels hoax (Medway).</text>
    <text x="60" y="452" fill="#B44A32">第二份描述出自已知故事的女孩，非独立来源。/ The second account comes from girls who already knew the story.</text>
  </g>
</svg>