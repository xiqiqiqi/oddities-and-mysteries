<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Two sightings over Phoenix, 13 March 1997</title>
  <desc id="desc">A timeline comparing the V formation at 7:55 p.m. with the flares at 10 p.m.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">PHOENIX · 13 MARCH 1997</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">TWO SIGHTINGS / ONE NAME</text>

  <g>
    <rect x="60" y="112" width="360" height="270" fill="#1D1A17"/>
    <g stroke="#F3EEE4" stroke-width="1" opacity=".18">
      <path d="M60 330 H420"/>
      <path d="M60 350 H420"/>
      <path d="M120 300 V382"/>
      <path d="M200 300 V382"/>
      <path d="M280 300 V382"/>
      <path d="M360 300 V382"/>
      <path d="M60 370 H420"/>
    </g>
    <g fill="#D99A2B">
      <circle cx="150" cy="190" r="7"/>
      <circle cx="192" cy="206" r="7"/>
      <circle cx="234" cy="222" r="7"/>
      <circle cx="276" cy="238" r="7"/>
      <circle cx="318" cy="254" r="7"/>
    </g>
    <g stroke="#D99A2B" stroke-width="1" opacity=".5">
      <path d="M150 190 L318 254"/>
      <path d="M150 190 L318 254" transform="translate(0 18)"/>
    </g>
    <text x="84" y="146" font-family="Georgia, serif" font-size="15" fill="#F3EEE4">19:55</text>
    <text x="84" y="168" font-family="Georgia, serif" font-size="11" fill="#D99A2B">V FORMATION</text>
    <text x="84" y="402" font-family="Georgia, serif" font-size="12" fill="#1D1A17">NO FLARES SCHEDULED / 无照明弹任务</text>
    <text x="84" y="422" font-family="Georgia, serif" font-size="12" fill="#B44A32">STILL UNRESOLVED / 仍无定论</text>
  </g>

  <g>
    <rect x="480" y="112" width="360" height="270" fill="#1D1A17"/>
    <g stroke="#F3EEE4" stroke-width="1" opacity=".18">
      <path d="M480 330 H840"/>
      <path d="M480 350 H840"/>
      <path d="M540 300 V382"/>
      <path d="M620 300 V382"/>
      <path d="M700 300 V382"/>
      <path d="M780 300 V382"/>
      <path d="M480 370 H840"/>
    </g>
    <g stroke="#F3EEE4" stroke-width="1" stroke-dasharray="4 6" opacity=".35">
      <path d="M592 182 L790 280"/>
    </g>
    <g fill="#D99A2B">
      <circle cx="592" cy="182" r="6"/>
      <circle cx="642" cy="206" r="6"/>
      <circle cx="692" cy="230" r="6"/>
      <circle cx="742" cy="254" r="6"/>
      <circle cx="792" cy="278" r="6" opacity=".45"/>
    </g>
    <text x="504" y="146" font-family="Georgia, serif" font-size="15" fill="#F3EEE4">22:00</text>
    <text x="504" y="168" font-family="Georgia, serif" font-size="11" fill="#D99A2B">LUU-2 FLARES</text>
    <text x="504" y="402" font-family="Georgia, serif" font-size="12" fill="#1D1A17">A-10 TRAINING / 靶场训练</text>
    <text x="504" y="422" font-family="Georgia, serif" font-size="12" fill="#6B6256">EXPLAINED / 已解释</text>
  </g>

  <g font-family="Georgia, serif" font-size="12" fill="#6B6256">
    <path d="M60 470 H840" stroke="#1D1A17" stroke-opacity=".25"/>
    <circle cx="150" cy="470" r="4" fill="#B44A32"/>
    <circle cx="510" cy="470" r="4" fill="#6B6256"/>
    <text x="120" y="497">19:55</text>
    <text x="480" y="497">22:00</text>
    <text x="640" y="497">LOCAL TIME / 当地时间</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
