<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">1626 Beijing and the Wanggongchang explosion</title>
  <desc id="desc">Schematic map of Ming Beijing showing the Wanggongchang gunpowder depot and the approximate blast area.</desc>
  <rect width="900" height="620" fill="#F3EEE4"/>
  <g stroke="#1D1A17" fill="none" stroke-width="1.5" opacity=".35">
    <path d="M180 70 L720 70 L760 520 L120 520 Z"/>
    <path d="M250 100 L680 100 L710 470 L190 470 Z"/>
  </g>
  <g font-family="Georgia, serif" fill="#1D1A17">
    <text x="60" y="56" font-size="26">BEIJING · 1626</text>
    <text x="60" y="80" font-size="12" fill="#6B6256">SCHEMATIC / NOT TO SCALE</text>
  </g>
  <circle cx="360" cy="330" r="120" fill="#D99A2B" opacity=".18" stroke="#D99A2B" stroke-dasharray="6 6"/>
  <circle cx="360" cy="330" r="16" fill="#B44A32"/>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="14">
    <text x="300" y="300" fill="#B44A32">WANGGONGCHANG</text>
    <text x="300" y="320" fill="#B44A32">王恭厂</text>
    <text x="500" y="230">FORBIDDEN CITY</text>
    <text x="500" y="250" fill="#6B6256">紫禁城</text>
    <text x="120" y="430">XUANWUMEN</text>
    <text x="120" y="450" fill="#6B6256">宣武门</text>
  </g>
  <g font-family="Georgia, serif" fill="#6B6256" font-size="12">
    <text x="500" y="400">Approximate blast area</text>
    <text x="500" y="420">爆炸影响范围（示意）</text>
  </g>
  <line x1="480" y1="390" x2="420" y2="360" stroke="#B44A32" stroke-width="1.5"/>
  <text x="60" y="570" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
