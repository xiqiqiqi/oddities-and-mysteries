<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Kuchisake-onna: the question, its branches and the survival tactics</title>
  <desc id="desc">A flow diagram: she asks "Watashi, kirei?" (Am I pretty?). Answer no: killed with scissors, or followed and killed at night. Answer yes: she removes the mask revealing the slit mouth and asks "Kore demo?" (Even now?). No or scream: killed. Hesitant yes: mouth slit to resemble hers. Survival tactics listed: answer "average", offer hard candy (bekko ame), say "pomade" three times, or say you are running late.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
  <text x="60" y="62" font-family="Georgia, serif" font-size="26" fill="#1D1A17">KUCHISAKE-ONNA · THE QUESTION</text>
  <text x="60" y="86" font-family="Georgia, serif" font-size="12" fill="#6B6256">我漂亮吗？· Watashi, kirei?</text>

  <g font-family="Georgia, serif">
    <rect x="330" y="110" width="240" height="44" fill="#D8CCB6" stroke="#6B4A32" stroke-width="1.4"/>
    <text x="352" y="137" font-size="12" fill="#1D1A17">"我漂亮吗？" / Watashi, kirei?</text>
    <path d="M380 154 L 200 190 M520 154 L 700 190" stroke="#6B4A32" stroke-width="1.4"/>
    <text x="230" y="176" font-size="10" fill="#B44A32">答"不"</text>
    <text x="600" y="176" font-size="10" fill="#4A4030">答"是"</text>
    <rect x="110" y="190" width="180" height="40" fill="#EFE6D6" stroke="#6B4A32"/>
    <text x="126" y="214" font-size="10" fill="#1D1A17">剪刀致死 / 夜访致死</text>
    <rect x="610" y="190" width="180" height="40" fill="#D8CCB6" stroke="#6B4A32"/>
    <text x="626" y="214" font-size="10" fill="#1D1A17">摘口罩，再问"这样呢？"</text>
    <path d="M660 230 L 560 268 M740 230 L 800 268" stroke="#6B4A32" stroke-width="1.4"/>
    <text x="560" y="256" font-size="10" fill="#B44A32">"不"/尖叫</text>
    <text x="760" y="256" font-size="10" fill="#4A4030">犹豫"是"</text>
    <rect x="470" y="268" width="180" height="40" fill="#EFE6D6" stroke="#6B4A32"/>
    <text x="500" y="292" font-size="10" fill="#1D1A17">致死</text>
    <rect x="710" y="268" width="180" height="40" fill="#EFE6D6" stroke="#6B4A32"/>
    <text x="724" y="292" font-size="10" fill="#1D1A17">嘴角被裂至耳</text>
  </g>

  <g font-family="Georgia, serif">
    <rect x="60" y="340" width="780" height="110" fill="#EFE6D6"/>
    <text x="80" y="366" font-size="10" fill="#1D1A17">逃法（传说版本不一）/ SURVIVAL TACTICS</text>
    <g font-size="9" fill="#4A4030">
      <text x="80" y="390">答"普通"/ average，争取逃跑时间</text>
      <text x="80" y="408">给硬糖（鼈甲飴 bekko ame），她会停下捡</text>
      <text x="450" y="390">连说三遍"pomade"（发油）</text>
      <text x="450" y="408">说"我赶时间"，她会鞠躬让路</text>
    </g>
    <text x="80" y="436" font-size="8" fill="#B44A32">版本互相矛盾：同一答案在不同版本里致死或获救。</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="482">1979 年夏经报纸与周刊扩散，学童由家长团体结伴护送回家。</text>
    <text x="60" y="500" fill="#B44A32">都市传说，非被证实的存在。/ Urban legend, not a verified being.</text>
  </g>
</svg>