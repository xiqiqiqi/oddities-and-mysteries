<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Polygonal masonry at Sacsayhuamán</title>
  <desc id="desc">A schematic elevation of an Inca wall made of tightly fitted polygonal blocks without mortar, with a detail of a blade stopping at a joint.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">SACSAYHUAMÁN · WALL</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">POLYGONAL MASONRY / DRY STONE / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="480" height="300" fill="#D9C6A5" opacity=".35"/>
    <text x="90" y="145" font-family="Georgia, serif" font-size="11" fill="#1D1A17">ELEVATION / 立面</text>

    <g fill="#B9A57A" stroke="#6B4A32" stroke-width="2">
      <path d="M90 175 L 160 162 L 185 190 L 180 225 L 100 225 L 82 200 Z"/>
      <path d="M185 190 L 250 165 L 290 190 L 285 225 L 180 225 Z"/>
      <path d="M290 190 L 360 162 L 400 190 L 395 225 L 285 225 Z"/>
      <path d="M400 190 L 470 165 L 510 195 L 505 228 L 395 225 Z"/>

      <path d="M82 200 L 100 225 L 180 225 L 185 260 L 175 300 L 95 298 L 75 255 Z"/>
      <path d="M180 225 L 285 225 L 295 260 L 285 300 L 175 300 L 185 260 Z"/>
      <path d="M285 225 L 395 225 L 405 260 L 395 300 L 285 300 L 295 260 Z"/>
      <path d="M395 225 L 505 228 L 515 265 L 505 302 L 395 300 L 405 260 Z"/>

      <path d="M95 298 L 175 300 L 190 335 L 180 390 L 100 390 L 80 345 Z"/>
      <path d="M175 300 L 285 300 L 300 335 L 290 390 L 180 390 L 190 335 Z"/>
      <path d="M285 300 L 395 300 L 410 335 L 400 390 L 290 390 L 300 335 Z"/>
      <path d="M395 300 L 505 302 L 520 340 L 510 390 L 400 390 L 410 335 Z"/>
    </g>

    <path d="M90 175 L 160 162 L 185 190 L 250 165 L 290 190 L 360 162 L 400 190 L 470 165 L 510 195" fill="none" stroke="#1D1A17" stroke-width="1.5" opacity=".55"/>
    <text x="90" y="440" font-family="Georgia, serif" font-size="10" fill="#6B6256">Limestone blocks, cut to fit their neighbours.</text>
    <text x="90" y="458" font-family="Georgia, serif" font-size="10" fill="#6B6256">石灰岩块逐块修形，紧密拼合。</text>
  </g>

  <g>
    <circle cx="720" cy="240" r="100" fill="#EFE6D6" stroke="#1D1A17" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M650 160 L 710 150 L 735 190 L 728 250 L 740 290 L 690 300 L 650 260 L 655 210 Z" fill="#B9A57A" stroke="#6B4A32" stroke-width="2"/>
    <path d="M735 190 L 790 170 L 830 200 L 840 260 L 815 300 L 740 290 L 728 250 Z" fill="#B9A57A" stroke="#6B4A32" stroke-width="2"/>
    <path d="M735 190 L 728 250 L 740 290" fill="none" stroke="#6B4A32" stroke-width="1.5"/>

    <path d="M840 228 L 742 235 L 840 242 Z" fill="#D8D0C4" stroke="#1D1A17" stroke-width="1.5"/>
    <rect x="840" y="226" width="18" height="18" fill="#6B4A32"/>
    <circle cx="742" cy="235" r="4" fill="#B44A32"/>

    <text x="620" y="130" font-family="Georgia, serif" font-size="11" fill="#1D1A17">NO MORTAR / 无灰浆</text>
    <text x="700" y="362" font-family="Georgia, serif" font-size="11" fill="#B44A32">BLADE STOPS</text>
    <text x="690" y="378" font-family="Georgia, serif" font-size="10" fill="#6B6256">刀片停在接缝处</text>
    <text x="640" y="398" font-family="Georgia, serif" font-size="10" fill="#6B6256">TIGHT JOINT / 紧密接缝</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="484">“A knife blade cannot fit” is a popular saying, not a measurement.</text>
    <text x="60" y="502" fill="#B44A32">“插不进刀片”是流行说法，不是测量结论。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
