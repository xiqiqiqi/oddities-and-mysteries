<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Plan of the Carnac stone alignments</title>
  <desc id="desc">A schematic plan of several groups of standing stones at Carnac, with rows, size changes, and a scale note.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">CARNAC · ALIGNMENTS</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">PLAN / SCHEMATIC / NOT A SURVEY</text>

  <rect x="60" y="112" width="780" height="300" fill="#DCE6D8" stroke="#1D1A17" stroke-opacity=".15"/>

  <g fill="#1D1A17">
    <g>
      <circle cx="140" cy="170" r="5"/><circle cx="180" cy="170" r="5"/><circle cx="220" cy="170" r="5"/><circle cx="260" cy="170" r="5"/><circle cx="300" cy="170" r="5"/>
      <circle cx="140" cy="200" r="5"/><circle cx="180" cy="200" r="5"/><circle cx="220" cy="200" r="5"/><circle cx="260" cy="200" r="5"/><circle cx="300" cy="200" r="5"/>
      <circle cx="140" cy="230" r="5"/><circle cx="180" cy="230" r="5"/><circle cx="220" cy="230" r="5"/><circle cx="260" cy="230" r="5"/><circle cx="300" cy="230" r="5"/>
    </g>
    <g>
      <circle cx="380" cy="210" r="6"/><circle cx="420" cy="210" r="6"/><circle cx="460" cy="210" r="6"/><circle cx="500" cy="210" r="6"/><circle cx="540" cy="210" r="6"/>
      <circle cx="380" cy="240" r="6"/><circle cx="420" cy="240" r="6"/><circle cx="460" cy="240" r="6"/><circle cx="500" cy="240" r="6"/><circle cx="540" cy="240" r="6"/>
      <circle cx="380" cy="270" r="6"/><circle cx="420" cy="270" r="6"/><circle cx="460" cy="270" r="6"/><circle cx="500" cy="270" r="6"/><circle cx="540" cy="270" r="6"/>
    </g>
    <g>
      <circle cx="620" cy="250" r="4"/><circle cx="655" cy="250" r="4"/><circle cx="690" cy="250" r="4"/><circle cx="725" cy="250" r="4"/><circle cx="760" cy="250" r="4"/>
      <circle cx="620" cy="278" r="4"/><circle cx="655" cy="278" r="4"/><circle cx="690" cy="278" r="4"/><circle cx="725" cy="278" r="4"/><circle cx="760" cy="278" r="4"/>
      <circle cx="620" cy="306" r="4"/><circle cx="655" cy="306" r="4"/><circle cx="690" cy="306" r="4"/><circle cx="725" cy="306" r="4"/><circle cx="760" cy="306" r="4"/>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="12" fill="#1D1A17">
    <text x="120" y="152">MÉNEC</text>
    <text x="370" y="192">KERMARIO</text>
    <text x="620" y="232">KERLESCAN</text>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="120" y="390">largest stones / 较大的石头</text>
    <path d="M120 372 L 300 372" stroke="#B44A32" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M120 372 L 128 366 M120 372 L 128 378 M300 372 L 292 366 M300 372 L 292 378" stroke="#B44A32" stroke-width="2" fill="none"/>
    <text x="620" y="390">smaller stones / 较小的石头</text>
  </g>

  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <rect x="60" y="442" width="780" height="1" fill="#1D1A17" opacity=".2"/>
    <text x="60" y="468">About 3,000 stones · rows run for several kilometres · erected in the Neolithic</text>
    <text x="60" y="488">约 3000 块石头 · 排列延伸数公里 · 立于新石器时代</text>
    <text x="60" y="510">Not to scale / 非精确比例 · Graphic: XIQIQI · CC BY-SA 4.0</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
