<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Mothman sightings and the Silver Bridge</title>
  <desc id="desc">A schematic timeline from the 1966 sightings to the 1967 Silver Bridge collapse, with a small map of Point Pleasant.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">MOTHMAN · POINT PLEASANT</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">SIGHTINGS / SILVER BRIDGE / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="380" height="230" fill="#DCE6D8"/>
    <path d="M60 260 C 130 240, 180 280, 250 265 S 370 235, 440 255" fill="none" stroke="#6FA8C8" stroke-width="12" opacity=".5"/>
    <text x="80" y="286" font-family="Georgia, serif" font-size="10" fill="#6B6256">OHIO RIVER / 俄亥俄河</text>
    <circle cx="250" cy="230" r="6" fill="#1D1A17"/>
    <text x="262" y="234" font-family="Georgia, serif" font-size="10" fill="#1D1A17">POINT PLEASANT</text>
    <circle cx="220" cy="170" r="6" fill="#B44A32"/>
    <text x="232" y="174" font-family="Georgia, serif" font-size="10" fill="#B44A32">TNT AREA / 废弃厂区</text>
    <path d="M300 250 L 340 250" stroke="#6B4A32" stroke-width="3"/>
    <text x="310" y="240" font-family="Georgia, serif" font-size="9" fill="#6B6256">SILVER BRIDGE</text>
    <text x="80" y="326" font-family="Georgia, serif" font-size="10" fill="#6B6256">Map is approximate / 地图为示意</text>
  </g>

  <g>
    <path d="M80 400 H 820" stroke="#1D1A17" stroke-width="2"/>
    <path d="M820 400 L 806 392 M820 400 L 806 408" stroke="#1D1A17" stroke-width="2" fill="none"/>
    <g fill="#B44A32">
      <circle cx="200" cy="400" r="8"/>
      <circle cx="470" cy="400" r="8"/>
      <circle cx="720" cy="400" r="8"/>
    </g>
    <g font-family="Georgia, serif" font-size="11" fill="#1D1A17">
      <text x="140" y="432">NOV 1966</text>
      <text x="130" y="448" font-size="10" fill="#6B6256">first reports / 最初目击</text>
      <text x="410" y="432">1967</text>
      <text x="400" y="448" font-size="10" fill="#6B6256">more sightings / 更多目击</text>
      <text x="650" y="432">DEC 15 1967</text>
      <text x="640" y="448" font-size="10" fill="#6B6256">bridge collapse / 银桥坍塌</text>
    </g>
  </g>

  <g>
    <circle cx="760" cy="108" r="13" fill="#1D1A17"/>
    <path d="M748 120 L 772 120 L 780 168 L 768 205 L 760 178 L 752 205 L 740 168 Z" fill="#1D1A17"/>
    <path d="M748 126 C 720 118, 700 138, 690 172 C 710 160, 730 158, 748 160 Z" fill="#1D1A17"/>
    <path d="M772 126 C 800 118, 820 138, 830 172 C 810 160, 790 158, 772 160 Z" fill="#1D1A17"/>
    <circle cx="755" cy="106" r="2.5" fill="#B44A32"/>
    <circle cx="765" cy="106" r="2.5" fill="#B44A32"/>
    <text x="700" y="238" font-family="Georgia, serif" font-size="10" fill="#6B6256">winged figure / 有翅人形</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="486">No clear photograph, feather, or body. / 没有清晰照片、羽毛或尸体。</text>
    <text x="60" y="504" fill="#B44A32">The bridge failed from a cracked eyebar, not from Mothman. / 银桥事故源于眼杆裂纹，与天蛾人无关。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
