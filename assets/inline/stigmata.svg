<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Stigmata: the wound locations, the cases and the explanations</title>
  <desc id="desc">A schematic body with marks at the hands, feet and side, and panels on the famous cases and the medical explanations.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">STIGMATA · 手上的伤</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">ASSISI 1224 / PADRE PIO / THE WOUNDS</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE WOUNDS / 伤口位置示意</text>

    <!-- body -->
    <circle cx="250" cy="178" r="17" fill="#E8DCC4" stroke="#8C7A52" stroke-width="1.4"/>
    <rect x="232" y="196" width="36" height="92" rx="10" fill="#E8DCC4" stroke="#8C7A52" stroke-width="1.4"/>
    <g stroke="#8C7A52" stroke-width="7" stroke-linecap="round">
      <line x1="234" y1="208" x2="202" y2="252"/>
      <line x1="266" y1="208" x2="298" y2="252"/>
      <line x1="240" y1="286" x2="232" y2="336"/>
      <line x1="260" y1="286" x2="268" y2="336"/>
    </g>
    <circle cx="200" cy="254" r="7" fill="#E8DCC4" stroke="#8C7A52" stroke-width="1.2"/>
    <circle cx="300" cy="254" r="7" fill="#E8DCC4" stroke="#8C7A52" stroke-width="1.2"/>
    <ellipse cx="230" cy="338" rx="9" ry="5" fill="#E8DCC4" stroke="#8C7A52" stroke-width="1.2"/>
    <ellipse cx="270" cy="338" rx="9" ry="5" fill="#E8DCC4" stroke="#8C7A52" stroke-width="1.2"/>

    <!-- marks -->
    <circle cx="200" cy="254" r="3.5" fill="#B44A32"/>
    <circle cx="300" cy="254" r="3.5" fill="#B44A32"/>
    <circle cx="230" cy="338" r="2.8" fill="#B44A32"/>
    <circle cx="270" cy="338" r="2.8" fill="#B44A32"/>
    <path d="M266 236 L 270 244" stroke="#B44A32" stroke-width="2.5"/>

    <!-- halo -->
    <circle cx="250" cy="170" r="24" fill="none" stroke="#C9A94A" stroke-width="1" opacity="0.7"/>

    <!-- labels -->
    <path d="M170 250 L 192 253" stroke="#6B6256" stroke-width="0.8" fill="none"/>
    <text x="80" y="248" font-family="Georgia, serif" font-size="8" fill="#1D1A17">HANDS / 手</text>
    <path d="M160 334 L 220 338" stroke="#6B6256" stroke-width="0.8" fill="none"/>
    <text x="80" y="336" font-family="Georgia, serif" font-size="8" fill="#1D1A17">FEET / 脚</text>
    <path d="M330 236 L 274 240" stroke="#6B6256" stroke-width="0.8" fill="none"/>
    <text x="334" y="232" font-family="Georgia, serif" font-size="8" fill="#1D1A17">SIDE / 肋旁</text>

    <text x="80" y="370" font-family="Georgia, serif" font-size="8" fill="#6B6256">a schematic body, not a medical image / 身体示意，不是医疗图像</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CASES / 案例</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">Francis of Assisi, 1224 / 方济各，1224</text>
      <text x="520" y="186">Padre Pio, 1918–1968 / 比奥神父，1918–1968</text>
      <text x="520" y="206">the Church, 1923: not established / 教会 1923：不能确认</text>
      <text x="520" y="226">canonised in 2002 / 2002 年封圣</text>
      <text x="520" y="242">not because of the wounds / 不是因为圣痕</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE EXPLANATIONS / 解释</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">suggestion and stress / 暗示与压力</text>
      <text x="520" y="330">self-injury / 自我伤害</text>
      <text x="520" y="348">fraud, sometimes confessed / 造假，有时有人承认</text>
      <text x="520" y="366">no scientific confirmation / 没有科学证实</text>
      <text x="520" y="382">the Church does not treat it as proof / 教会不把它当作证据</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Wounds that follow the image of the Passion.</text>
    <text x="60" y="470">跟着受难图像出现的伤口。</text>
    <text x="60" y="494" fill="#B44A32">Faith, psychology and fraud all appear in the record. / 信仰、心理与造假都出现在记录里。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
