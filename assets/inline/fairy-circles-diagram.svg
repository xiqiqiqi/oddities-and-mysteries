<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Fairy circles from above and in section</title>
  <desc id="desc">A schematic showing the plan pattern of fairy circles and a cross-section through a bare centre and grassy rim.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">FAIRY CIRCLES · NAMIB</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">PLAN / SECTION / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="390" height="300" fill="#C9B98F"/>
    <g fill="#B44A32" opacity=".82">
      <circle cx="110" cy="160" r="14"/>
      <circle cx="170" cy="150" r="20"/>
      <circle cx="245" cy="162" r="12"/>
      <circle cx="320" cy="150" r="17"/>
      <circle cx="390" cy="164" r="11"/>
      <circle cx="95" cy="230" r="18"/>
      <circle cx="160" cy="238" r="11"/>
      <circle cx="230" cy="228" r="16"/>
      <circle cx="300" cy="240" r="21"/>
      <circle cx="380" cy="232" r="13"/>
      <circle cx="125" cy="310" r="12"/>
      <circle cx="195" cy="318" r="18"/>
      <circle cx="270" cy="306" r="11"/>
      <circle cx="340" cy="322" r="16"/>
      <circle cx="405" cy="310" r="10"/>
      <circle cx="80" cy="380" r="13"/>
      <circle cx="150" cy="386" r="10"/>
      <circle cx="220" cy="378" r="16"/>
      <circle cx="290" cy="390" r="12"/>
      <circle cx="360" cy="380" r="19"/>
