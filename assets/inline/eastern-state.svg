<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Eastern State Penitentiary: radial plan, separate system and timeline</title>
  <desc id="desc">A radial plan of Eastern State Penitentiary with seven cellblocks around an octagonal central hall, and panels on the separate system and the inmates.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">EASTERN STATE · 一个人的监狱</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">THE RADIAL PLAN / THE SEPARATE SYSTEM / 1829–1971</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">PLAN / 平面示意</text>

    <!-- cellblocks -->
    <g stroke="#D8CCB6" stroke-width="16" stroke-linecap="round">
      <line x1="270" y1="260" x2="270" y2="160"/>
      <line x1="270" y1="260" x2="348.2" y2="197.6"/>
      <line x1="270" y1="260" x2="367.5" y2="282.3"/>
      <line x1="270" y1="260" x2="313.4" y2="350.1"/>
      <line x1="270" y1="260" x2="226.6" y2="350.1"/>
      <line x1="270" y1="260" x2="172.5" y2="282.3"/>
      <line x1="270" y1="260" x2="191.8" y2="197.6"/>
    </g>
    <g stroke="#8C7A52" stroke-width="1.2" stroke-dasharray="2 5">
      <line x1="270" y1="260" x2="270" y2="160"/>
      <line x1="270" y1="260" x2="348.2" y2="197.6"/>
      <line x1="270" y1="260" x2="367.5" y2="282.3"/>
      <line x1="270" y1="260" x2="313.4" y2="350.1"/>
      <line x1="270" y1="260" x2="226.6" y2="350.1"/>
      <line x1="270" y1="260" x2="172.5" y2="282.3"/>
      <line x1="270" y1="260" x2="191.8" y2="197.6"/>
    </g>

    <!-- central hall -->
    <polygon points="299.6,272.2 282.2,289.6 257.8,289.6 240.4,272.2 240.4,247.8 257.8,230.4 282.2,230.4 299.6,247.8" fill="#D8CCB6" stroke="#6B4A32" stroke-width="1.4"/>
    <circle cx="270" cy="260" r="3" fill="#B44A32"/>

    <!-- labels -->
    <text x="80" y="370" font-family="Georgia, serif" font-size="7" fill="#1D1A17">SEVEN CELLBLOCKS AROUND ONE HALL / 七条走廊围绕八角大厅</text>
    <text x="80" y="382" font-family="Georgia, serif" font-size="7" fill="#4A4030">one inmate per cell / 一人一间牢房</text>

    <!-- eye of god -->
    <circle cx="270" cy="160" r="2.5" fill="#B44A32"/>
    <text x="284" y="158" font-family="Georgia, serif" font-size="7" fill="#4A4030">EYE OF GOD / 上帝之眼</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE SYSTEM / 制度</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">opened 1829 / 1829 年启用</text>
      <text x="520" y="186">256 cells originally / 最初 256 间牢房</text>
      <text x="520" y="206">one inmate per cell / 一人一间</text>
      <text x="520" y="226">silence, Bible, no letters / 沉默、《圣经》、不许写信</text>
      <text x="520" y="242">a small walled yard / 一堵高墙围起的小院</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE INMATES / 住过的人</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">Al Capone, 1929 / 阿尔·卡彭，1929</text>
      <text x="520" y="330">eight months / 八个月</text>
      <text x="520" y="348">Willie Sutton, 1945 / 威利·萨顿，1945</text>
      <text x="520" y="366">tunnel escape, caught / 挖隧道逃跑，被抓回</text>
      <text x="520" y="382">closed 1971, museum 1994 / 1971 关闭，1994 博物馆</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">A prison designed to hold one man at a time, in silence.</text>
    <text x="60" y="470">一座一次只关一个人、要求绝对安静的监狱。</text>
    <text x="60" y="494" fill="#B44A32">The separate system was abandoned; the building is now a museum and a Halloween attraction. / 单独制被放弃，建筑成了博物馆和万圣节鬼屋。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
