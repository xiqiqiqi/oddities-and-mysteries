<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Foo fighter sightings over the Rhine valley</title>
  <desc id="desc">A schematic map of night-fighter routes and reported light sightings in the Rhine valley during the winter of 1944.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">FOO FIGHTERS · 1944–45</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">NIGHT-FIGHTER AREAS / RHINE VALLEY / SCHEMATIC</text>

  <rect x="70" y="112" width="500" height="300" fill="#DCE6D8" stroke="#1D1A17" stroke-opacity=".2"/>
  <path d="M330 112 C 300 160, 350 190, 330 230 C 310 270, 350 320, 320 412" fill="none" stroke="#6FA8C8" stroke-width="8" opacity=".55"/>
  <path d="M330 112 C 300 160, 350 190, 330 230 C 310 270, 350 320, 320 412" fill="none" stroke="#1D1A17" stroke-width="1" opacity=".3"/>
  <path d="M395 112 C 365 170, 410 210, 390 260 C 370 310, 405 360, 380 412" fill="none" stroke="#1D1A17" stroke-width="1.5" stroke-dasharray="7 6" opacity=".5"/>
  <g font-family="Georgia, serif" fill="#6B6256" font-size="11">
    <text x="180" y="150">FRANCE</text>
    <text x="430" y="150">GERMANY</text>
    <text x="286" y="250" transform="rotate(-78 286 250)">RHINE</text>
  </g>

  <g fill="#1D1A17">
    <circle cx="180" cy="230" r="5"/>
    <circle cx="210" cy="300" r="5"/>
    <circle cx="250" cy="360" r="5"/>
  </g>
  <g stroke="#1D1A17" stroke-width="1.5" fill="none" opacity=".7">
    <path d="M180 230 L 300 260 L 380 250"/>
    <path d="M210 300 L 320 310 L 400 300"/>
    <path d="M250 360 L 350 350 L 410 330"/>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="120" y="252">NIGHT-FIGHTER BASES</text>
    <text x="120" y="268">夜航机场</text>
    <text x="300" y="382">PATROL ROUTES / 巡逻航线</text>
  </g>

  <g>
    <path d="M470 190 L 500 200 L 470 210 L 476 200 Z" fill="#1D1A17"/>
    <g fill="#D99A2B" stroke="#B44A32" stroke-width="1">
      <circle cx="520" cy="180" r="6"/>
      <circle cx="544" cy="196" r="5" opacity=".85"/>
      <circle cx="560" cy="220" r="4" opacity=".7"/>
    </g>
    <text x="448" y="250" font-family="Georgia, serif" font-size="10" fill="#B44A32">LIGHTS PACING</text>
    <text x="448" y="265" font-family="Georgia, serif" font-size="10" fill="#B44A32">THE AIRCRAFT</text>
    <text x="448" y="282" font-family="Georgia, serif" font-size="10" fill="#6B6256">跟在机翼旁的光球</text>
  </g>

  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <rect x="600" y="130" width="240" height="1" fill="#1D1A17" opacity=".2"/>
    <text x="600" y="160" fill="#B44A32">COMMON DESCRIPTIONS / 常见描述</text>
    <text x="600" y="190">• orange, red or white balls</text>
    <text x="600" y="210">• no sound, usually no radar</text>
    <text x="600" y="230">• keeps distance, then vanishes</text>
    <text x="600" y="250">• no attack, no damage</text>
    <text x="600" y="285" fill="#6B6256">橙色、红色或白色的光球</text>
    <text x="600" y="305" fill="#6B6256">无声音，通常无雷达回波</text>
    <text x="600" y="325" fill="#6B6256">保持距离，随后消失</text>
    <text x="600" y="345" fill="#6B6256">不攻击，不造成破坏</text>
  </g>

  <text x="60" y="460" font-family="Georgia, serif" font-size="11" fill="#6B6256">Not a precise map / 非精确地图 · Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
