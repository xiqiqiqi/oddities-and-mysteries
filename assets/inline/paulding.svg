<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Paulding Light: the viewing point, the old railroad grade, and US-45</title>
  <desc id="desc">A schematic cross-section of the viewing point in the forest, the old railroad grade, and the distant highway whose headlights create the light, plus panels on the legend and the 2010 investigation.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE PAULDING LIGHT · MICHIGAN</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">A VIEWING POINT / AN OLD GRADE / CAR HEADLIGHTS</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">SECTION / 剖面示意</text>

    <!-- ground profile -->
    <path d="M70 340 H230 L320 305 H460 V372 H70 Z" fill="#D8CCB6" stroke="#8C7A52" stroke-width="1"/>

    <!-- trees -->
    <g fill="#6B7A5A" opacity="0.8">
      <path d="M196 340 L204 300 L212 340 Z"/>
      <path d="M232 336 L240 292 L248 336 Z"/>
      <path d="M268 330 L276 286 L284 330 Z"/>
      <path d="M300 316 L308 278 L316 316 Z"/>
    </g>

    <!-- viewing point car -->
    <rect x="85" y="328" width="30" height="12" rx="3" fill="#6B7A8A" stroke="#4A4030" stroke-width="1"/>
    <circle cx="93" cy="342" r="3" fill="#1D1A17"/>
    <circle cx="107" cy="342" r="3" fill="#1D1A17"/>

    <!-- highway car -->
    <rect x="404" y="291" width="26" height="10" rx="2" fill="#6B7A8A" stroke="#4A4030" stroke-width="1"/>
    <circle cx="410" cy="303" r="2.5" fill="#1D1A17"/>
    <circle cx="424" cy="303" r="2.5" fill="#1D1A17"/>

    <!-- beam -->
    <path d="M404 292 L 250 240 L 246 258 L 400 300 Z" fill="#C9A227" opacity="0.18"/>
    <path d="M404 295 L 246 250" stroke="#C9A227" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="244" cy="250" r="7" fill="#F7F1E4" stroke="#C9A227" stroke-width="1.5"/>

    <g font-family="Georgia, serif" font-size="8" fill="#1D1A17">
      <text x="78" y="365">VIEWING POINT / 观测点</text>
      <text x="150" y="355">OLD RAIL GRADE / 旧铁路路基</text>
      <text x="238" y="200">TREES / 树林</text>
      <text x="378" y="270">US-45 / 约 7 km</text>
      <text x="382" y="320">headlights / 车灯</text>
      <text x="150" y="238">the light / 光点</text>
    </g>
    <path d="M205 241 L 236 248" stroke="#1D1A17" stroke-width="1"/>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE LEGEND / 传说</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">a brakeman decapitated / 铁路工人被砍头</text>
      <text x="520" y="186">his lantern in the trees</text>
      <text x="520" y="202">他提着灯，在路基上找自己的头</text>
      <text x="520" y="222">versions vary / 版本不一</text>
      <text x="520" y="240">no name, no date, no record</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">2010 / 调查</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">Michigan Tech SPIE students</text>
      <text x="520" y="328">密歇根理工的光学学生</text>
      <text x="520" y="348">telescope: cars on US-45</text>
      <text x="520" y="364">望远镜里看到的是公路汽车</text>
      <text x="520" y="382">recreated with headlights / 用车灯复现</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The light is seen from a pull-off beside an old railroad grade.</text>
    <text x="60" y="470">观测点在旧铁路路基旁，面对一片低矮的树林。</text>
    <text x="60" y="494" fill="#B44A32">The light can be reproduced with car headlights on US-45. / 用 US-45 上的车灯可以复现这个光点。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
