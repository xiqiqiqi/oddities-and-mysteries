<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Shroud of Turin: the cloth, the image, and the radiocarbon date</title>
  <desc id="desc">A schematic of the shroud laid flat with front and back images, dimensions, burn marks and patches, plus panels on the historical dates and the 1988 radiocarbon result.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE SHROUD OF TURIN · 1354–1988</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">LINEN / IMAGE / RADIOCARBON</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE CLOTH / 布面示意</text>

    <!-- dimensions -->
    <path d="M80 155 H440" stroke="#6B6256" stroke-width="1"/>
    <path d="M80 150 V 160 M440 150 V 160" stroke="#6B6256" stroke-width="1"/>
    <text x="260" y="149" font-family="Georgia, serif" font-size="8" fill="#6B6256" text-anchor="middle">4.4 m</text>
    <path d="M452 165 V 270" stroke="#6B6256" stroke-width="1"/>
    <path d="M447 165 H457 M447 270 H457" stroke="#6B6256" stroke-width="1"/>
    <text x="462" y="217" transform="rotate(-90 462 217)" font-family="Georgia, serif" font-size="8" fill="#6B6256" text-anchor="middle">1.1 m</text>

    <!-- cloth -->
    <rect x="80" y="165" width="360" height="105" fill="#F7F1E4" stroke="#B8A582" stroke-width="1.2"/>
    <path d="M260 165 V 270" stroke="#B8A582" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- front figure -->
    <g fill="#C9B799" opacity="0.75">
      <circle cx="150" cy="190" r="10"/>
      <path d="M140 202 H160 L164 235 H156 L155 262 H146 L148 235 H136 Z"/>
      <path d="M140 204 L126 236 M160 204 L174 236" stroke="#C9B799" stroke-width="4" fill="none"/>
    </g>
    <!-- back figure -->
    <g fill="#C9B799" opacity="0.75">
      <circle cx="370" cy="190" r="10"/>
      <path d="M360 202 H380 L384 235 H376 L375 262 H366 L368 235 H356 Z"/>
      <path d="M360 204 L346 236 M380 204 L394 236" stroke="#C9B799" stroke-width="4" fill="none"/>
    </g>

    <!-- wounds -->
    <g fill="#B44A32" opacity="0.55">
      <circle cx="127" cy="240" r="1.6"/>
      <circle cx="173" cy="240" r="1.6"/>
      <circle cx="149" cy="258" r="1.6"/>
      <circle cx="156" cy="258" r="1.6"/>
      <circle cx="347" cy="240" r="1.6"/>
      <circle cx="393" cy="240" r="1.6"/>
      <circle cx="369" cy="258" r="1.6"/>
      <circle cx="376" cy="258" r="1.6"/>
    </g>

    <!-- burn marks and patches -->
    <g fill="#8C7A52" opacity="0.5">
      <ellipse cx="96" cy="252" rx="6" ry="10"/>
      <ellipse cx="424" cy="184" rx="6" ry="10"/>
    </g>
    <g fill="none" stroke="#8C7A52" stroke-width="0.8" stroke-dasharray="2 2">
      <rect x="88" y="170" width="34" height="20"/>
      <rect x="396" y="240" width="36" height="18"/>
    </g>

    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="122" y="292">FRONT / 正面</text>
      <text x="340" y="292">BACK / 背面</text>
      <text x="212" y="312">head to head / 头对头</text>
    </g>
    <path d="M260 278 V 300" stroke="#4A4030" stroke-width="0.8"/>
    <text x="85" y="340" font-family="Georgia, serif" font-size="8" fill="#4A4030">scorch marks and patches from the 1532 fire / 1532 年火灾留下的焦痕与补丁</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="150" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE DATES / 年代</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="162">1354 · Lirey, France / 利雷展出</text>
      <text x="520" y="180">1389 · the bishop's letter / 主教写信</text>
      <text x="520" y="198">1532 · fire in Chambéry / 尚贝里火灾</text>
      <text x="520" y="216">1578 · moved to Turin / 迁到都灵</text>
      <text x="520" y="234">1898 · Pia's photograph / 皮亚的底片</text>
      <text x="520" y="252">1988 · radiocarbon dating / 碳十四测年</text>
    </g>
  </g>

  <g>
    <rect x="500" y="272" width="340" height="120" fill="#EFE6D6"/>
    <text x="520" y="300" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE DATE / 测年</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="324">1260–1390, 95% confidence</text>
      <text x="520" y="340">置信度 95%，三个实验室一致</text>
      <text x="520" y="360">Arizona · Oxford · Zurich</text>
      <text x="520" y="378">one sample from a corner / 样本来自一角，修补争议未决</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The cloth is 4.4 metres long and 1.1 metres wide.</text>
    <text x="60" y="470">布长四米四，宽一米一，平时保存在都灵主教座堂，不公开展出。</text>
    <text x="60" y="494" fill="#B44A32">Radiocarbon dating put the linen between 1260 and 1390; the sampling is still disputed. / 碳十四把布料定在 1260–1390 年，取样问题仍有争议。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
