<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The werewolf of Bedburg: the trial, the execution and the explanations</title>
  <desc id="desc">A five-stage timeline from the 1580s to the pamphlet accounts of Peter Stumpp's trial and execution, with panels on the werewolf legend and on the medical explanations.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE WEREWOLF OF BEDBURG · 1589</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">PETER STUMPP / TORTURE / THE PAMPHLETS</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="132" font-family="Georgia, serif" font-size="8" fill="#6B6256">FIVE STAGES / 五个阶段</text>

    <path d="M95 160 V 340" stroke="#8C7A52" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="95" cy="160" r="3.5"/>
      <circle cx="95" cy="205" r="3.5"/>
      <circle cx="95" cy="250" r="3.5"/>
      <circle cx="95" cy="295" r="3.5"/>
      <circle cx="95" cy="340" r="3.5"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="115" y="160">1580s · BEDBURG / 贝德堡</text>
      <text x="115" y="205">1589 · ARREST / 被捕</text>
      <text x="115" y="250">TORTURE / 酷刑</text>
      <text x="115" y="295">31 OCT 1589 · EXECUTION / 处决</text>
      <text x="115" y="340">AFTER · PAMPHLETS / 小册子</text>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="115" y="175">富农彼得·斯通普，有土地与家庭</text>
      <text x="115" y="220">罪名：巫术、变形、吃人</text>
      <text x="115" y="265">供出魔鬼给的一条腰带</text>
      <text x="115" y="310">轮刑、斩首、焚烧；女儿与情妇同死</text>
      <text x="115" y="355">木刻与文字传遍德国和英国</text>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE ELEMENTS / 要素</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">a man becomes a wolf / 人变成狼</text>
      <text x="520" y="186">a belt from the devil / 魔鬼的腰带</text>
      <text x="520" y="206">night, livestock, children / 夜间、牲畜、孩子</text>
      <text x="520" y="226">village fear and scapegoats</text>
      <text x="520" y="240">村庄的恐惧与替罪羊</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE EXPLANATIONS / 解释</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">clinical lycanthropy / 临床狼人症</text>
      <text x="520" y="330">hypertrichosis / 先天性多毛症</text>
      <text x="520" y="348">rabies, ergot, porphyria</text>
      <text x="520" y="364">狂犬病、麦角中毒、卟啉症</text>
      <text x="520" y="382">the full moon link is modern / 满月是后来的说法</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Peter Stumpp was executed at Bedburg on 31 October 1589.</text>
    <text x="60" y="470">1589 年 10 月 31 日，彼得·斯通普在贝德堡被处决。</text>
    <text x="60" y="494" fill="#B44A32">His confession was obtained under torture and cannot be treated as fact. / 他的供词是在酷刑下取得的，不能当作事实。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
