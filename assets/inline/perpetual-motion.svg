<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Perpetual motion: the overbalanced wheel and the cases</title>
  <desc id="desc">A diagram of an overbalanced wheel with hinged weights, with panels on the famous cases and on the physics that rules them out.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">PERPETUAL MOTION · 永动机</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">THE OVERBALANCED WHEEL / BESSLER / REDHEFFER</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE IDEA / 设计示意</text>

    <!-- wheel -->
    <circle cx="255" cy="245" r="88" fill="none" stroke="#6B4A32" stroke-width="3"/>
    <g stroke="#8C7A52" stroke-width="1.2">
      <line x1="255" y1="245" x2="343" y2="245"/>
      <line x1="255" y1="245" x2="317" y2="307"/>
      <line x1="255" y1="245" x2="255" y2="333"/>
      <line x1="255" y1="245" x2="193" y2="307"/>
      <line x1="255" y1="245" x2="167" y2="245"/>
      <line x1="255" y1="245" x2="193" y2="183"/>
      <line x1="255" y1="245" x2="255" y2="157"/>
      <line x1="255" y1="245" x2="317" y2="183"/>
    </g>

    <!-- hinged weights -->
    <g stroke="#6B4A32" stroke-width="1.5">
      <line x1="343" y1="245" x2="355" y2="245"/>
      <line x1="317" y1="307" x2="328" y2="318"/>
      <line x1="255" y1="333" x2="255" y2="345"/>
      <line x1="193" y1="307" x2="182" y2="318"/>
      <line x1="167" y1="245" x2="185" y2="245"/>
      <line x1="193" y1="183" x2="206" y2="171"/>
      <line x1="255" y1="157" x2="255" y2="145"/>
      <line x1="317" y1="183" x2="304" y2="171"/>
    </g>
    <g fill="#8C5A3A">
      <circle cx="355" cy="245" r="7"/>
      <circle cx="328" cy="318" r="7"/>
      <circle cx="255" cy="345" r="7"/>
      <circle cx="182" cy="318" r="7"/>
      <circle cx="185" cy="245" r="7"/>
      <circle cx="206" cy="171" r="7"/>
      <circle cx="255" cy="145" r="7"/>
      <circle cx="304" cy="171" r="7"/>
    </g>

    <!-- rotation arrow -->
    <path d="M196 150 C 225 130 285 130 314 150" fill="none" stroke="#B44A32" stroke-width="1.6"/>
    <path d="M308 143 L 316 151 L 305 155" fill="none" stroke="#B44A32" stroke-width="1.6"/>

    <text x="80" y="352" font-family="Georgia, serif" font-size="8" fill="#1D1A17">OVERBALANCED WHEEL / 偏心轮</text>
    <text x="80" y="366" font-family="Georgia, serif" font-size="8" fill="#4A4030">weights swing out on one side / 一侧的锤子向外甩出</text>
    <text x="80" y="380" font-family="Georgia, serif" font-size="8" fill="#6B6256">the heavy side never stays heavy / 重的一边不会一直重</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CASES / 案例</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">Villard, c. 1230 / 维拉尔，约 1230</text>
      <text x="520" y="186">Bessler, 1712 / 贝斯勒，1712</text>
      <text x="520" y="206">sealed test, 54 days / 封条测试，54 天</text>
      <text x="520" y="226">Redheffer, 1812 / 雷德赫弗，1812</text>
      <text x="520" y="242">a hidden crank / 一根藏起来的曲柄</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE PHYSICS / 物理</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">energy is conserved / 能量守恒</text>
      <text x="520" y="330">friction takes the rest / 摩擦消耗能量</text>
      <text x="520" y="348">first law: nothing is created / 第一定律：不能创造能量</text>
      <text x="520" y="366">second law: no perfect engine / 第二定律：没有完美的热机</text>
      <text x="520" y="382">no machine has passed / 没有一台通过测试</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The wheel always stops; the claims never do.</text>
    <text x="60" y="470">轮子总会停，说法不会。</text>
    <text x="60" y="494" fill="#B44A32">No perpetual-motion machine has ever passed an independent test. / 没有任何永动机通过过独立测试。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
