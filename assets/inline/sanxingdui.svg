<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Sanxingdui: the bronze mask, the finds and the kingdom</title>
  <desc id="desc">A stylized Sanxingdui bronze mask with bulging eyes and huge ears, with panels on the finds and the ancient Shu kingdom.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">SANXINGDUI · 青铜面具</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">SICHUAN / 1986 / NO WRITING</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE MASK / 面具示意</text>

    <!-- ears -->
    <path d="M150 220 C 110 210 96 240 108 270 C 118 296 140 304 160 296 Z" fill="#8C9A7A" stroke="#4A4030" stroke-width="1.2"/>
    <path d="M350 220 C 390 210 404 240 392 270 C 382 296 360 304 340 296 Z" fill="#8C9A7A" stroke="#4A4030" stroke-width="1.2"/>

    <!-- face -->
    <path d="M150 200 Q150 168 190 164 L310 164 Q350 168 350 200 L342 286 Q334 326 250 332 Q166 326 158 286 Z" fill="#8C9A7A" stroke="#4A4030" stroke-width="1.5"/>

    <!-- eyes -->
    <circle cx="205" cy="232" r="24" fill="#D8CCB6" stroke="#4A4030" stroke-width="1.5"/>
    <circle cx="295" cy="232" r="24" fill="#D8CCB6" stroke="#4A4030" stroke-width="1.5"/>
    <circle cx="205" cy="232" r="9" fill="#1D1A17"/>
    <circle cx="295" cy="232" r="9" fill="#1D1A17"/>
    <path d="M178 206 L 232 206 M268 206 L 322 206" stroke="#4A4030" stroke-width="4"/>

    <!-- nose and mouth -->
    <path d="M250 246 L 232 292 L 268 292 Z" fill="#6B7A5A" stroke="#4A4030" stroke-width="1"/>
    <path d="M198 306 Q250 322 302 306" fill="none" stroke="#4A4030" stroke-width="3"/>
    <path d="M190 296 L 198 306 M310 296 L 302 306" stroke="#4A4030" stroke-width="1.5"/>

    <!-- labels -->
    <path d="M210 160 L 205 206" stroke="#6B6256" stroke-width="0.8" fill="none"/>
    <text x="80" y="158" font-family="Georgia, serif" font-size="8" fill="#1D1A17">PROTRUDING EYES / 凸眼</text>
    <path d="M150 330 L 128 300" stroke="#6B6256" stroke-width="0.8" fill="none"/>
    <text x="80" y="342" font-family="Georgia, serif" font-size="8" fill="#1D1A17">HUGE EARS / 巨耳</text>
    <text x="80" y="360" font-family="Georgia, serif" font-size="8" fill="#6B6256">bronze, about 138 cm wide / 青铜，宽约 138 厘米</text>
    <text x="80" y="376" font-family="Georgia, serif" font-size="8" fill="#6B6256">no writing has been found / 没有发现文字</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE FINDS / 出土</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">1929: a pit of jade / 1929：一坑玉器</text>
      <text x="520" y="186">1986: two sacrificial pits / 1986：两个祭祀坑</text>
      <text x="520" y="206">bronze tree, 3.96 m / 青铜神树，3.96 米</text>
      <text x="520" y="226">standing figure, 2.62 m / 青铜立人，2.62 米</text>
      <text x="520" y="242">2021: a gold mask / 2021：金面具</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE KINGDOM / 古国</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">ancient Shu, c. 12th–11th c. BCE / 古蜀，约前 12–前 11 世纪</text>
      <text x="520" y="330">contemporary with the Shang / 与商朝同时</text>
      <text x="520" y="348">advanced bronze casting / 发达的青铜铸造</text>
      <text x="520" y="366">local forms, not aliens / 本地造型，不是外星人</text>
      <text x="520" y="382">new museum, 2023 / 新馆，2023 年</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">A kingdom that left no writing, only faces.</text>
    <text x="60" y="470">一个没有留下文字、只留下面孔的古国。</text>
    <text x="60" y="494" fill="#B44A32">The “alien” reading has no evidence; the masks are a local bronze tradition. / “外星人”说法没有证据，面具是本地青铜传统。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
