<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">How sailing stones move</title>
  <desc id="desc">A schematic cross-section of a flooded playa, thin ice, wind, and a rock pushed by an ice raft.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="26" fill="#1D1A17">SAILING STONES</text>
  <text x="60" y="82" font-family="Georgia, serif" font-size="12" fill="#6B6256">RACETRACK PLAYA / SCHEMATIC</text>
  <rect x="80" y="330" width="740" height="90" fill="#D9C9A8"/>
  <rect x="80" y="350" width="740" height="18" fill="#6FA8C8" opacity=".55"/>
  <rect x="260" y="342" width="360" height="10" fill="#EAF8FF" opacity=".8"/>
  <path d="M300 342 L 430 342 L 460 320 L 330 320 Z" fill="#9ED8F0" opacity=".55"/>
  <path d="M330 320 L 345 280 L 380 280 L 395 320 Z" fill="#2A251F"/>
  <path d="M80 392 C 220 386, 320 400, 460 392 C 580 386, 680 400, 820 392" fill="none" stroke="#B44A32" stroke-width="3" stroke-dasharray="10 8"/>
  <g stroke="#1D1A17" fill="none" stroke-width="2">
    <path d="M540 260 L 660 260"/>
    <path d="M660 260 L 640 248"/>
    <path d="M660 260 L 640 272"/>
  </g>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="14">
    <text x="100" y="320">THIN ICE / 薄冰</text>
    <text x="100" y="380">WINTER FLOOD / 冬季浅水</text>
    <text x="540" y="240">WIND / 风</text>
    <text x="430" y="305">ICE RAFT / 冰筏</text>
    <text x="610" y="425">TRAIL / 轨迹</text>
  </g>
  <text x="60" y="480" font-family="Georgia, serif" font-size="12" fill="#6B6256">The ice raft pushes the rock; the rock leaves a trail in the mud.</text>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
