<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Whistle spectrogram</title>
  <desc id="desc">A schematic spectrogram of the Whistle sound, with a thin whistle-like tone and an icequake signature.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="26" fill="#1D1A17">WHISTLE · 1997</text>
  <text x="60" y="82" font-family="Georgia, serif" font-size="12" fill="#6B6256">SPECTROGRAM / SCHEMATIC</text>
  <rect x="100" y="120" width="700" height="280" fill="#E7DEC9" stroke="#1D1A17" opacity=".35"/>
  <g stroke="#1D1A17" opacity=".12">
    <path d="M240 120 L 240 400"/><path d="M380 120 L 380 400"/><path d="M520 120 L 520 400"/><path d="M660 120 L 660 400"/>
    <path d="M100 190 L 800 190"/><path d="M100 260 L 800 260"/><path d="M100 330 L 800 330"/>
  </g>
  <path d="M150 300 C 220 250, 280 210, 350 200 S 470 240, 540 280 S 660 330, 760 300" fill="none" stroke="#6FA8C8" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 330 C 240 330, 320 325, 420 340 S 600 350, 760 345" fill="none" stroke="#D99A2B" stroke-width="2" opacity=".8"/>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="13">
    <text x="360" y="190" fill="#6FA8C8">whistle-like tone / 口哨状信号</text>
    <text x="430" y="370" fill="#B44A32">icequake signature / 冰震特征</text>
    <text x="100" y="440">0</text><text x="760" y="440">time / 时间</text>
    <text x="815" y="270" transform="rotate(-90 815 270)">FREQUENCY / 频率</text>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#6B6256">
    <text x="100" y="475">A thin, rising-and-falling tone — not a creature, but ice.</text>
    <text x="100" y="495">一条细长的、上下起伏的信号，后来被识别为冰震。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
