<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Mary Rogers: the cigar girl, the Hudson, and the front pages</title>
  <desc id="desc">A five-date timeline of the Mary Rogers case, with panels on the newspapers and on Edgar Allan Poe's story.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">MARY ROGERS · NEW YORK, 1841</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">THE CIGAR GIRL / THE HUDSON / THE FRONT PAGES</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="132" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE CASE IN FIVE DATES / 五个日期</text>

    <path d="M95 158 V 358" stroke="#8C7A52" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="95" cy="158" r="3.5"/>
      <circle cx="95" cy="208" r="3.5"/>
      <circle cx="95" cy="258" r="3.5"/>
      <circle cx="95" cy="308" r="3.5"/>
      <circle cx="95" cy="358" r="3.5"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="115" y="158">25 JUL 1841 · SHE LEAVES / 她离开</text>
      <text x="115" y="208">28 JUL 1841 · THE BODY / 尸体</text>
      <text x="115" y="258">AUG 1841 · THE CLOTHES / 衣物</text>
      <text x="115" y="308">OCT 1841 · PAYNE DIES / 佩恩之死</text>
      <text x="115" y="358">OCT 1842 · LOSS TALKS / 临终改口</text>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="115" y="173">说去新泽西看亲戚，第二天回来</text>
      <text x="115" y="223">霍博肯，西比尔洞附近的水面</text>
      <text x="115" y="273">绣着 M.R. 的手帕；洛斯说见过一个高个子男人</text>
      <text x="115" y="323">鸦片酊，岸边，留下一张字条</text>
      <text x="115" y="373">她说：手术失败，尸体被扔进河里</text>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE PRESS / 报纸</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">1838: a fake suicide note / 一封“遗书”</text>
      <text x="520" y="186">three papers on the front page</text>
      <text x="520" y="202">《先驱报》《太阳报》《论坛报》头版</text>
      <text x="520" y="222">a tall, dark man / 一个又高又黑的男人</text>
      <text x="520" y="240">no arrest / 没有人被捕</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">POE / 爱伦·坡</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">1842: “The Mystery of Marie Rogêt”</text>
      <text x="520" y="330">moved to Paris, renamed Marie</text>
      <text x="520" y="346">搬到巴黎，改名玛丽，让杜宾破案</text>
      <text x="520" y="366">Poe claimed a rigorous analysis</text>
      <text x="520" y="382">坡自称做了严谨的分析，但他也没破案</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Mary Rogers was in her early twenties when she disappeared.</text>
    <text x="60" y="470">玛丽·罗杰斯失踪时二十出头，在自由街的雪茄店站柜台。</text>
    <text x="60" y="494" fill="#B44A32">No one was ever convicted; Loss's deathbed story does not match the autopsy. / 没有人被定罪，洛斯的临终说法与验尸记录并不完全吻合。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
