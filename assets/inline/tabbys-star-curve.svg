<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Schematic light curve of Tabby's Star</title>
  <desc id="desc">An illustrative light curve showing irregular dimming events between 2009 and 2013, including deep dips.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">KIC 8462852 · LIGHT CURVE</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">TABBY'S STAR / SCHEMATIC, NOT RAW DATA</text>

  <g stroke="#1D1A17" stroke-opacity=".16" stroke-width="1">
    <path d="M100 130 H840"/>
    <path d="M100 190 H840"/>
    <path d="M100 250 H840"/>
    <path d="M100 310 H840"/>
    <path d="M100 370 H840"/>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <text x="56" y="134">100%</text>
    <text x="62" y="254">90%</text>
    <text x="62" y="374">80%</text>
  </g>

  <path d="M100 130
           L 140 132 L 180 129 L 220 133 L 260 150 L 280 168 L 300 150 L 340 131
           L 380 130 L 410 136 L 430 150 L 445 224 L 460 250 L 475 210 L 490 150 L 520 133
           L 560 132 L 590 138 L 610 160 L 625 230 L 640 290 L 655 250 L 670 170 L 700 140
           L 740 132 L 780 129 L 820 133 L 840 132"
        fill="none" stroke="#1D1A17" stroke-width="3"/>

  <g stroke="#B44A32" stroke-width="1.4" stroke-dasharray="4 5" fill="none">
    <path d="M445 224 V382"/>
    <path d="M640 290 V382"/>
  </g>
  <g font-family="Georgia, serif" font-size="12" fill="#B44A32">
    <text x="424" y="404">2011</text>
    <text x="618" y="404">2013</text>
    <text x="770" y="404">TIME</text>
  </g>
  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <text x="520" y="200">IRREGULAR DIPS</text>
    <text x="520" y="218">不规则变暗</text>
    <text x="656" y="330">UP TO 20%+</text>
    <text x="656" y="348">最高超过两成</text>
  </g>

  <g>
    <rect x="100" y="436" width="14" height="14" fill="#6FA8C8"/>
    <text x="122" y="448" font-family="Georgia, serif" font-size="11" fill="#6B6256">2017: BLUE DIMS MORE THAN RED / 蓝光掉得更多</text>
    <rect x="430" y="436" width="14" height="14" fill="#D99A2B"/>
    <text x="452" y="448" font-family="Georgia, serif" font-size="11" fill="#6B6256">DUST, NOT A SOLID STRUCTURE / 尘埃而非实心遮挡</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
