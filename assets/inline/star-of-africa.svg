<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Star of Africa: the Cullinan rough, the cut stones and the sceptre</title>
  <desc id="desc">A rough Cullinan diamond and a row of cut diamonds with Cullinan I circled, and panels on the stone and the cutting.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE STAR OF AFRICA · 非洲之星</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">CULLINAN 1905 / 530.2 CARATS / THE SCEPTRE</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE CUTTING / 切割示意</text>

    <!-- rough -->
    <polygon points="120,220 150,180 210,175 250,210 235,270 170,285 125,260" fill="#D8E4EC" stroke="#6B7A8A" stroke-width="1.4"/>
    <g stroke="#8C9AA8" stroke-width="0.8">
      <line x1="150" y1="180" x2="185" y2="240"/>
      <line x1="210" y1="175" x2="185" y2="240"/>
      <line x1="250" y1="210" x2="185" y2="240"/>
      <line x1="235" y1="270" x2="185" y2="240"/>
      <line x1="170" y1="285" x2="185" y2="240"/>
      <line x1="125" y1="260" x2="185" y2="240"/>
    </g>
    <text x="100" y="312" font-family="Georgia, serif" font-size="8" fill="#1D1A17">3,106 ct ROUGH / 原石</text>

    <!-- arrow -->
    <path d="M258 232 L 288 232" stroke="#8C7A52" stroke-width="1.2"/>
    <path d="M282 227 L 290 232 L 282 237" fill="none" stroke="#8C7A52" stroke-width="1.2"/>

    <!-- cut stones -->
    <g fill="#D8E4EC" stroke="#6B7A8A" stroke-width="1">
      <polygon points="300,228 318,250 300,272 282,250"/>
      <polygon points="345,208 359,224 345,240 331,224"/>
      <polygon points="378,238 390,252 378,266 366,252"/>
      <polygon points="408,262 420,276 408,290 396,276"/>
      <polygon points="438,286 450,300 438,314 426,300"/>
    </g>
    <g stroke="#8C9AA8" stroke-width="0.7">
      <line x1="300" y1="228" x2="300" y2="272"/>
      <line x1="282" y1="250" x2="318" y2="250"/>
      <line x1="345" y1="208" x2="345" y2="240"/>
      <line x1="331" y1="224" x2="359" y2="224"/>
    </g>
    <ellipse cx="300" cy="250" rx="26" ry="34" fill="none" stroke="#B44A32" stroke-width="1.4"/>

    <path d="M300 284 L 300 310 L 330 318" stroke="#B44A32" stroke-width="0.8" fill="none"/>
    <text x="334" y="326" font-family="Georgia, serif" font-size="8" fill="#B44A32">CULLINAN I / 库利南一号</text>
    <text x="334" y="336" font-family="Georgia, serif" font-size="8" fill="#B44A32">530.2 ct</text>

    <text x="80" y="356" font-family="Georgia, serif" font-size="8" fill="#6B6256">9 large stones + 96 small / 九颗大钻，九十六颗小钻</text>
    <text x="80" y="372" font-family="Georgia, serif" font-size="8" fill="#6B6256">cut in Amsterdam, 8 months / 在阿姆斯特丹切割，历时八个月</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE STONE / 原石</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">found in 1905 / 1905 年发现</text>
      <text x="520" y="186">Premier Mine, near Pretoria / 比勒陀利亚附近的普雷米尔矿</text>
      <text x="520" y="206">3,106 carats / 3,106 克拉</text>
      <text x="520" y="226">named after Thomas Cullinan / 以托马斯·库利南命名</text>
      <text x="520" y="242">gift to Edward VII, 1907 / 1907 年送给爱德华七世</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CUT / 切割</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">Amsterdam, 8 months / 阿姆斯特丹，八个月</text>
      <text x="520" y="330">Cullinan I: 530.2 ct / 库利南一号：530.2 克拉</text>
      <text x="520" y="348">Cullinan II: 317.4 ct / 库利南二号：317.4 克拉</text>
      <text x="520" y="366">Sovereign's Sceptre / 英王权杖</text>
      <text x="520" y="382">Tower of London / 伦敦塔</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">A stone cut into a symbol, then put behind glass.</text>
    <text x="60" y="470">一块石头被切成象征，然后放进玻璃柜。</text>
    <text x="60" y="494" fill="#B44A32">Cullinan I is the largest stone cut from the Cullinan diamond. / 库利南一号是库利南原石切出的最大一颗。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
