<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Ark of the Covenant: the chest, its dimensions, and its fate</title>
  <desc id="desc">A schematic of the gold-covered wooden chest with two cherubim and carrying poles, with dimension labels, plus panels on the object and its fate.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE ARK OF THE COVENANT · 金皮木箱</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">ACACIA / GOLD / TWO CHERUBIM</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="136" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE CHEST / 约柜示意</text>

    <!-- poles -->
    <path d="M118 282 H402" stroke="#8C6A1F" stroke-width="5"/>
    <circle cx="118" cy="282" r="4" fill="#D8B24A" stroke="#8C6A1F" stroke-width="1"/>
    <circle cx="402" cy="282" r="4" fill="#D8B24A" stroke="#8C6A1F" stroke-width="1"/>

    <!-- chest -->
    <rect x="150" y="245" width="220" height="65" fill="#D8B24A" stroke="#8C6A1F" stroke-width="1.2"/>
    <rect x="145" y="235" width="230" height="12" fill="#E4C878" stroke="#8C6A1F" stroke-width="1.2"/>

    <!-- cherubim -->
    <g fill="#E4C878" stroke="#8C6A1F" stroke-width="1">
      <circle cx="200" cy="215" r="6"/>
      <path d="M200 221 C 192 225 190 232 194 235 L 206 235 C 210 232 208 225 200 221 Z"/>
      <path d="M196 218 C 180 206 170 206 166 214 C 176 214 184 220 190 228 Z"/>
      <path d="M204 218 C 220 206 230 206 234 214 C 224 214 216 220 210 228 Z"/>

      <circle cx="320" cy="215" r="6"/>
      <path d="M320 221 C 312 225 310 232 314 235 L 326 235 C 330 232 328 225 320 221 Z"/>
      <path d="M316 218 C 300 206 290 206 286 214 C 296 214 304 220 310 228 Z"/>
      <path d="M324 218 C 340 206 350 206 354 214 C 344 214 336 220 330 228 Z"/>
    </g>

    <!-- dimensions -->
    <path d="M150 330 H370" stroke="#6B6256" stroke-width="1"/>
    <path d="M150 325 V 335 M370 325 V 335" stroke="#6B6256" stroke-width="1"/>
    <text x="260" y="346" font-family="Georgia, serif" font-size="8" fill="#6B6256" text-anchor="middle">2.5 cubits / 两肘半</text>

    <g font-family="Georgia, serif" font-size="8" fill="#1D1A17">
      <text x="238" y="187">MERCY SEAT / 施恩座</text>
      <text x="290" y="200">CHERUBIM / 基路伯</text>
    </g>
    <g stroke="#1D1A17" stroke-width="1">
      <path d="M262 192 L 258 234"/>
      <path d="M322 204 L 322 209"/>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="150" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE OBJECT / 物件</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">acacia wood, gold inside and out</text>
      <text x="520" y="182">金合欢木，里外都包金</text>
      <text x="520" y="202">2.5 × 1.5 × 1.5 cubits</text>
      <text x="520" y="218">长两肘半，宽高各一肘半</text>
      <text x="520" y="238">two cherubim / 两个基路伯</text>
      <text x="520" y="254">carrying poles / 抬杠</text>
    </g>
  </g>

  <g>
    <rect x="500" y="274" width="340" height="118" fill="#EFE6D6"/>
    <text x="520" y="302" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE FATE / 下落</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="328">captured by the Philistines / 被非利士人夺走</text>
      <text x="520" y="346">586 BCE: the Temple burned / 圣殿被焚</text>
      <text x="520" y="364">no record after that / 此后无记载</text>
      <text x="520" y="382">Aksum claim unverified / 阿克苏姆说法无法检验</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The Ark is described in Exodus as a gold-covered chest for the tablets.</text>
    <text x="60" y="470">《出埃及记》把约柜描述为一个包金木箱，里面放十诫石板。</text>
    <text x="60" y="494" fill="#B44A32">No verified Ark has ever been found; the Ethiopian claim cannot be examined. / 没有确认的约柜实物，埃塞俄比亚的说法无法检验。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
