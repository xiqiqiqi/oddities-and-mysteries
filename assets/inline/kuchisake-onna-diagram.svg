<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The question structure of the Kuchisake-onna legend</title>
  <desc id="desc">A flowchart showing the masked woman's question, the removal of the mask, the second question, and the reported variations.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">KUCHISAKE-ONNA · THE QUESTION</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">URBAN LEGEND / FLOWCHART / VERSIONS VARY</text>

  <g>
    <rect x="330" y="112" width="240" height="64" fill="#1D1A17"/>
    <text x="450" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#F3EEE4">“AM I PRETTY?”</text>
    <text x="450" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">“我漂亮吗？”</text>
  </g>

  <g stroke="#1D1A17" stroke-width="1.5" fill="none">
    <path d="M390 176 L 300 222"/>
    <path d="M450 176 L 450 222"/>
    <path d="M510 176 L 600 222"/>
  </g>
  <g fill="#1D1A17" font-family="Georgia, serif" font-size="11">
    <text x="320" y="204">YES / 漂亮</text>
    <text x="458" y="204">NO / 不漂亮</text>
    <text x="580" y="204">“AVERAGE” / 一般</text>
  </g>

  <g>
    <rect x="220" y="222" width="160" height="58" fill="#EFE6D6" stroke="#1D1A17" stroke-width="1.5"/>
    <text x="300" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1D1A17">MASK OFF</text>
    <text x="300" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6B6256">摘下口罩</text>
  </g>
  <g>
    <rect x="400" y="222" width="140" height="58" fill="#EFE6D6" stroke="#1D1A17" stroke-width="1.5"/>
    <text x="470" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#B44A32">ANGRY</text>
    <text x="470" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6B6256">被激怒</text>
  </g>
  <g>
    <rect x="580" y="222" width="160" height="58" fill="#EFE6D6" stroke="#1D1A17" stroke-width="1.5"/>
    <text x="660" y="246" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#B44A32">PAUSE</text>
    <text x="660" y="264" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6B6256">愣住，可趁机跑</text>
  </g>

  <g>
    <rect x="220" y="320" width="160" height="58" fill="#1D1A17"/>
    <text x="300" y="344" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#F3EEE4">“STILL PRETTY?”</text>
    <text x="300" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">“这样呢？”</text>
  </g>
  <g stroke="#1D1A17" stroke-width="1.5" fill="none">
    <path d="M300 280 L 300 320"/>
    <path d="M300 378 L 300 404"/>
  </g>
  <path d="M300 414 L 294 404 L 306 404 Z" fill="#1D1A17"/>

  <g>
    <rect x="220" y="414" width="180" height="46" fill="#EFE6D6" stroke="#1D1A17" stroke-width="1.5"/>
    <text x="310" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1D1A17">OUTCOME VARIES</text>
    <text x="310" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#6B6256">结局因版本而异</text>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="430" y="430" fill="#B44A32">SCISSORS / 剪刀</text>
    <text x="430" y="446">the threat in most versions</text>
    <text x="430" y="462">多数版本里的威胁</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="478">No verified attacker or victim record. / 没有经证实的袭击者或受害者记录。</text>
    <text x="60" y="498">The “rules” change from school to school. / “规则”在不同学校、不同版本里并不一致。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
