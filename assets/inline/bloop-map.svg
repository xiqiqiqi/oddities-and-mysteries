<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Bloop and the Pacific hydrophone array</title>
  <desc id="desc">A schematic of the Pacific Ocean, the PMEL hydrophone array, and the estimated source of the Bloop.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="58" font-family="Georgia, serif" font-size="26" fill="#1D1A17">BLOOP · 1997</text>
  <text x="60" y="82" font-family="Georgia, serif" font-size="12" fill="#6B6256">SOUTH PACIFIC / SCHEMATIC</text>
  <rect x="80" y="120" width="740" height="280" fill="#6FA8C8" opacity=".16" stroke="#1D1A17" stroke-opacity=".25"/>
  <g fill="#1D1A17">
    <circle cx="200" cy="200" r="5"/>
    <circle cx="500" cy="170" r="5"/>
    <circle cx="690" cy="330" r="5"/>
  </g>
  <g stroke="#1D1A17" stroke-width="2">
    <path d="M200 200 L 500 170 L 690 330 Z" fill="none" stroke-dasharray="6 6" opacity=".5"/>
    <path d="M200 200 L 200 188"/><path d="M500 170 L 500 158"/><path d="M690 330 L 690 318"/>
  </g>
  <circle cx="540" cy="330" r="16" fill="none" stroke="#B44A32" stroke-width="2"/>
  <circle cx="540" cy="330" r="5" fill="#B44A32"/>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="13">
    <text x="140" y="235">PMEL HYDROPHONE ARRAY</text>
    <text x="140" y="253" fill="#6B6256">水听器阵列</text>
    <text x="500" y="300" fill="#B44A32">ESTIMATED SOURCE</text>
    <text x="500" y="318" fill="#B44A32">估计声源</text>
    <text x="560" y="360" fill="#6B6256">ICEBERG CALVING / 冰山崩解</text>
  </g>
  <g stroke="#B44A32" fill="none" stroke-width="1.5" opacity=".6">
    <circle cx="540" cy="330" r="36"/>
    <circle cx="540" cy="330" r="58"/>
    <circle cx="540" cy="330" r="80"/>
  </g>
  <path d="M100 450 C 150 425, 200 475, 250 450 S 350 425, 400 450 S 500 475, 550 450 S 650 425, 700 450 S 780 475, 820 450" fill="none" stroke="#D99A2B" stroke-width="4"/>
  <g font-family="Georgia, serif" font-size="12" fill="#6B6256">
    <text x="100" y="485">about 1 minute / 约 1 分钟</text>
    <text x="620" y="485">low-frequency sound</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
