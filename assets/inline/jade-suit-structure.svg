      <path d="M500 190 C 510 185, 520 185, 530 175"/>
      <path d="M500 205 C 520 200, 540 195, 550 175"/>
      <path d="M580 190 C 590 185, 600 185, 610 190"/>
      <path d="M620 190 C 630 185, 645 180, 660 180"/>
      <path d="M510 260 C 525 255, 540 250, 550 245"/>
      <path d="M600 250 C 610 245, 620 250, 630 260"/>
      <path d="M610 260 C 620 265, 630 270, 640 280"/>
