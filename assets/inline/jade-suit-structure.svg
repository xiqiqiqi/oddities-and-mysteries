    <path d="M510 310 L 502 328" stroke="#B44A32" stroke-width="1.5" fill="none"/>
    <text x="474" y="338" font-family="Georgia, serif" font-size="9" fill="#B44A32">jade plaque / 玉片</text>
    <path d="M660 180 L 700 180" stroke="#D99A2B" stroke-width="1.5"/>
    <text x="706" y="184" font-family="Georgia, serif" font-size="9" fill="#6B6256">gold wire</text>
    <text x="706" y="196" font-family="Georgia, serif" font-size="9" fill="#6B6256">金丝</text>

    <text x="474" y="360" font-family="Georgia, serif" font-size="11" fill="#1D1A17">2,000+ plaques · about 1 kg gold wire</text>
    <text x="474" y="378" font-family="Georgia, serif" font-size="10" fill="#6B6256">两千多片玉 · 约一公斤金丝</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Only emperors and high nobles could use gold thread.</text>
    <text x="60" y="470">只有皇帝和高级贵族可以使用金缕。</text>
    <text x="60" y="494" fill="#B44A32">The body still decayed; the suit did not preserve it. / 尸体仍然腐烂，玉衣并未保鲜。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
