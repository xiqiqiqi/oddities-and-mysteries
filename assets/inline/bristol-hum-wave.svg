<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">The Bristol Hum waveform</title>
  <desc id="desc">Schematic of a low-frequency drone compared with the frequency range of normal speech.</desc>
  <rect width="900" height="420" fill="#F3EEE4"/>
  <text x="60" y="60" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE BRISTOL HUM</text>
  <text x="60" y="84" font-family="Georgia, serif" font-size="12" fill="#6B6256">LOW-FREQUENCY DRONE / SCHEMATIC</text>
  <line x1="60" y1="250" x2="840" y2="250" stroke="#1D1A17" opacity=".3"/>
  <path d="M60 250 C 90 210, 120 290, 150 250 S 210 210, 240 290 S 300 210, 330 290 S 390 210, 420 290 S 480 210, 510 290 S 570 210, 600 290 S 660 210, 690 290 S 750 210, 780 290 S 810 230, 840 250" fill="none" stroke="#D99A2B" stroke-width="3"/>
  <line x1="60" y1="320" x2="840" y2="320" stroke="#1D1A17" opacity=".15"/>
  <text x="60" y="360" font-family="Georgia, serif" font-size="12" fill="#6B6256">20 Hz — low-frequency hum</text>
  <text x="540" y="360" font-family="Georgia, serif" font-size="12" fill="#6B6256">normal speech — 200 Hz+</text>
  <text x="60" y="400" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
