<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Maura Murray: the fixed points of 9 February 2004 and the days before</title>
  <desc id="desc">Timeline: 5 February an emotional phone call about her sister; 7 February car shopping with her father; 8 February 3:30 am crashes her father's Corolla into a guardrail in Hadley; 9 February 15:15:37 ATM withdrawal of 280 dollars, the last known image; emails professors claiming a family death; 19:27 a resident reports a car off Route 112; a passing motorist speaks with the driver who declines help; 19:46 police arrive and she is gone; 2009 the case moves to the cold case unit as suspicious.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
  <text x="60" y="62" font-family="Georgia, serif" font-size="26" fill="#1D1A17">MAURA MURRAY · 2004-02-09</text>
  <text x="60" y="86" font-family="Georgia, serif" font-size="12" fill="#6B6256">十九分钟的空窗 · the nineteen-minute gap</text>

  <path d="M70 250 H 840" stroke="#6B4A32" stroke-width="2"/>
  <g font-family="Georgia, serif">
    <circle cx="90" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="70" y="222" font-size="11" fill="#1D1A17">02-05</text>
    <text x="66" y="286" font-size="9" fill="#4A4030">值班时崩溃通话</text>
    <text x="66" y="300" font-size="8" fill="#6B6256">"My sister."</text>

    <circle cx="190" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="170" y="222" font-size="11" fill="#1D1A17">02-07</text>
    <text x="166" y="286" font-size="9" fill="#4A4030">与父亲看车</text>
    <text x="166" y="300" font-size="8" fill="#6B6256">借父亲 Corolla</text>

    <circle cx="290" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="266" y="222" font-size="11" fill="#1D1A17">02-08 03:30</text>
    <text x="266" y="286" font-size="9" fill="#4A4030">Hadley 撞护栏</text>
    <text x="266" y="300" font-size="8" fill="#6B6256">父车损近万美元</text>

    <circle cx="400" cy="250" r="7" fill="#B44A32"/>
    <text x="370" y="222" font-size="11" fill="#1D1A17">02-09 15:15</text>
    <text x="376" y="286" font-size="9" fill="#4A4030">ATM 取 280 美元</text>
    <text x="376" y="300" font-size="8" fill="#6B6256">最后已知影像</text>

    <circle cx="510" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="486" y="222" font-size="11" fill="#1D1A17">02-09 下午</text>
    <text x="486" y="286" font-size="9" fill="#4A4030">邮件称家人去世</text>
    <text x="486" y="300" font-size="8" fill="#6B6256">亲属否认</text>

    <circle cx="620" cy="250" r="7" fill="#B44A32"/>
    <text x="596" y="222" font-size="11" fill="#1D1A17">19:27</text>
    <text x="596" y="286" font-size="9" fill="#4A4030">居民报警车离路</text>
    <text x="596" y="300" font-size="8" fill="#6B6256">Route 112</text>

    <circle cx="720" cy="250" r="7" fill="#B44A32"/>
    <text x="696" y="222" font-size="11" fill="#1D1A17">19:46</text>
    <text x="696" y="286" font-size="9" fill="#4A4030">警察到，人已不在</text>
    <text x="696" y="300" font-size="8" fill="#6B6256">车与物留下</text>

    <circle cx="820" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="796" y="222" font-size="11" fill="#1D1A17">2009</text>
    <text x="780" y="286" font-size="9" fill="#4A4030">转悬案组</text>
    <text x="780" y="300" font-size="8" fill="#6B6256">"suspicious"</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="400">19:27 到 19:46 之间十九分钟：有人与她说过话，随后她消失。</text>
    <text x="60" y="418">Nineteen minutes between the call and the police: someone spoke with her, then she was gone.</text>
    <text x="60" y="452" fill="#B44A32">至今无确认目击、无定论线索。/ No confirmed sighting or definitive lead since.</text>
  </g>
</svg>