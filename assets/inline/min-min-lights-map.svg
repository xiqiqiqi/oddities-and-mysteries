<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Min Min light sightings in outback Queensland</title>
  <desc id="desc">A schematic map of western Queensland around Boulia, with a road, a car, and a light hovering ahead.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">MIN MIN LIGHT · QUEENSLAND</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">OUTBACK SIGHTINGS / SCHEMATIC</text>

  <rect x="60" y="112" width="430" height="300" fill="#D9C6A5" stroke="#1D1A17" stroke-opacity=".2"/>
  <path d="M60 300 C 130 280, 190 320, 260 300 S 380 270, 490 300" fill="none" stroke="#6FA8C8" stroke-width="6" opacity=".4"/>
  <g stroke="#1D1A17" stroke-width="1.2" opacity=".55" fill="none">
    <path d="M90 380 L 300 250 L 470 200"/>
    <path d="M150 412 L 280 330 L 430 300"/>
    <path d="M100 170 L 220 220 L 300 250"/>
  </g>
  <g fill="#1D1A17">
    <circle cx="300" cy="250" r="6"/>
  </g>
  <g font-family="Georgia, serif" fill="#1D1A17" font-size="12">
    <text x="312" y="246">BOULIA</text>
    <text x="312" y="263" font-size="10" fill="#6B6256">博利亚</text>
  </g>
  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="90" y="152">CHANNEL COUNTRY / 内陆河床区</text>
    <text x="90" y="432">SIGHTINGS REPORTED ALONG THE ROADS / 目击多发生在公路沿线</text>
  </g>

  <g>
    <rect x="530" y="112" width="310" height="300" fill="#14110F"/>
    <path d="M530 330 L 840 300 L 840 412 L 530 412 Z" fill="#6B4A32" opacity=".8"/>
    <path d="M620 412 L 660 330 L 680 330 L 700 412 Z" fill="#D99A2B" opacity=".22"/>
    <g fill="#F3EEE4" opacity=".8">
      <circle cx="570" cy="150" r="1.3"/>
      <circle cx="620" cy="180" r="1.1"/>
      <circle cx="700" cy="140" r="1.4"/>
      <circle cx="780" cy="170" r="1"/>
      <circle cx="820" cy="210" r="1.2"/>
    </g>
    <path d="M620 330 L 640 292 L 680 292 L 700 330 Z" fill="#1D1A17" stroke="#F3EEE4" stroke-width="1" opacity=".9"/>
    <circle cx="660" cy="268" r="13" fill="#F3EEE4" opacity=".9"/>
    <circle cx="660" cy="268" r="26" fill="none" stroke="#F3EEE4" stroke-width="1" opacity=".3"/>
    <text x="700" y="264" font-family="Georgia, serif" font-size="11" fill="#F3EEE4">LIGHT AHEAD</text>
    <text x="700" y="281" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">前方不明光点</text>
    <path d="M640 350 L 640 318" stroke="#D99A2B" stroke-width="2" fill="none"/>
    <path d="M640 318 L 634 326 L 646 326 Z" fill="#D99A2B"/>
    <text x="560" y="390" font-family="Georgia, serif" font-size="10" fill="#D8D0C4">CAR / 车辆</text>
    <text x="560" y="440" font-family="Georgia, serif" font-size="10" fill="#6B6256">Distance and behaviour vary between reports / 距离与行为因报告而异</text>
  </g>

  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <text x="60" y="460">COMMON REPORTS / 常见描述</text>
    <text x="60" y="482">white, yellow or red light · follows a car · vanishes when approached</text>
    <text x="60" y="500">白色、黄色或红色 · 跟着车走 · 靠近时消失</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
