<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Rajneeshee bioterror attack: planning, outbreak, exposure and prosecution, 1981 to 1986</title>
  <desc id="desc">Timeline: 1981 the commune incorporates Rajneeshpuram and takes Antelope; 29 August 1984 two county commissioners poisoned via water; September to October 1984 salad bars of ten restaurants contaminated, 751 ill; November 1984 high turnout defeats the plot; 28 February 1985 Congressman Weaver accuses the Rajneeshees in the House; 16 September 1985 Rajneesh accuses Sheela and invites investigators; 2 October 1985 laboratory vials match the outbreak strain; 22 July 1986 Sheela and Puja enter Alford pleas, later serve 29 months.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
  <text x="60" y="62" font-family="Georgia, serif" font-size="26" fill="#1D1A17">RAJNEESHEE · 1981–1986</text>
  <text x="60" y="86" font-family="Georgia, serif" font-size="12" fill="#6B6256">沙拉吧上的沙门氏菌 · salmonella on the salad bar</text>

  <path d="M70 250 H 840" stroke="#6B4A32" stroke-width="2"/>
  <g font-family="Georgia, serif">
    <circle cx="90" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="70" y="222" font-size="11" fill="#1D1A17">1981</text>
    <text x="66" y="286" font-size="9" fill="#4A4030">公社建镇</text>
    <text x="66" y="300" font-size="8" fill="#6B6256">接管 Antelope</text>

    <circle cx="190" cy="250" r="7" fill="#B44A32"/>
    <text x="160" y="222" font-size="11" fill="#1D1A17">1984-08-29</text>
    <text x="166" y="286" font-size="9" fill="#4A4030">两杯水下毒</text>
    <text x="166" y="300" font-size="8" fill="#6B6256">县委员访公社</text>

    <circle cx="300" cy="250" r="7" fill="#B44A32"/>
    <text x="270" y="222" font-size="11" fill="#1D1A17">1984-09/10</text>
    <text x="276" y="286" font-size="9" fill="#4A4030">十家餐厅沙拉吧</text>
    <text x="276" y="300" font-size="8" fill="#6B6256">751 人中毒</text>

    <circle cx="410" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="386" y="222" font-size="11" fill="#1D1A17">1984-11</text>
    <text x="386" y="286" font-size="9" fill="#4A4030">高投票率</text>
    <text x="386" y="300" font-size="8" fill="#6B6256">阴谋落空</text>

    <circle cx="510" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="480" y="222" font-size="11" fill="#1D1A17">1985-02-28</text>
    <text x="486" y="286" font-size="9" fill="#4A4030">韦弗众院指控</text>
    <text x="486" y="300" font-size="8" fill="#6B6256">被视为偏执</text>

    <circle cx="620" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="590" y="222" font-size="11" fill="#1D1A17">1985-10-02</text>
    <text x="596" y="286" font-size="9" fill="#4A4030">实验室菌株匹配</text>
    <text x="596" y="300" font-size="8" fill="#6B6256">CDC 确认</text>

    <circle cx="730" cy="250" r="6" fill="#C9B799" stroke="#6B4A32"/>
    <text x="700" y="222" font-size="11" fill="#1D1A17">1986-07-22</text>
    <text x="706" y="286" font-size="9" fill="#4A4030">Sheela/Puja 认罪</text>
    <text x="706" y="300" font-size="8" fill="#6B6256">Alford plea</text>

    <circle cx="820" cy="250" r="7" fill="#B44A32"/>
    <text x="790" y="222" font-size="11" fill="#1D1A17">服刑</text>
    <text x="780" y="286" font-size="9" fill="#4A4030">29 个月后假释</text>
    <text x="780" y="300" font-size="8" fill="#6B6256">原判 3–20 年</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="400">美国历史上第一起、也是最大一起生物恐怖袭击。</text>
    <text x="60" y="418">The first and largest bioterrorist attack in U.S. history.</text>
    <text x="60" y="452" fill="#B44A32">751 人中毒、45 人住院、无人死亡。/ 751 infected, 45 hospitalised, none died.</text>
  </g>
</svg>