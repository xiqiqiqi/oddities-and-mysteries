<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">How a peat bog preserves a body</title>
  <desc id="desc">A section through a peat bog showing the water table, peat layers, a body at two to three metres, and the conditions that prevent decay.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">BOG BODIES · PRESERVATION</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">PEAT BOG SECTION / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="500" height="280" fill="#DCE6E8"/>

    <!-- surface and peat -->
    <rect x="60" y="152" width="500" height="16" fill="#6F8F5A"/>
    <rect x="60" y="168" width="500" height="62" fill="#9A7350"/>
    <rect x="60" y="230" width="500" height="80" fill="#7A573C"/>
    <rect x="60" y="310" width="500" height="82" fill="#5A3E2B"/>

    <!-- bog pool -->
    <path d="M80 152 C 110 146, 160 146, 200 152 L 200 168 H 80 Z" fill="#3E5A5A"/>
    <path d="M92 157 C 120 153, 150 153, 176 157" fill="none" stroke="#8FB3B0" stroke-width="1.5" opacity=".7"/>

    <!-- sphagnum tufts -->
    <g fill="#8FAE6E">
      <circle cx="230" cy="152" r="6"/>
      <circle cx="244" cy="150" r="5"/>
      <circle cx="258" cy="153" r="4"/>
      <circle cx="300" cy="151" r="5"/>
      <circle cx="314" cy="153" r="4"/>
      <circle cx="480" cy="152" r="6"/>
      <circle cx="494" cy="150" r="5"/>
    </g>

    <!-- water table -->
    <path d="M60 175 H 560" stroke="#6FA8C8" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- depth scale -->
    <path d="M528 175 V 383" stroke="#F3EEE4" stroke-width="1" opacity=".7"/>
    <g stroke="#F3EEE4" stroke-width="1" opacity=".7">
      <path d="M522 175 H 528"/>
      <path d="M522 227 H 528"/>
      <path d="M522 279 H 528"/>
      <path d="M522 331 H 528"/>
      <path d="M522 383 H 528"/>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#F3EEE4" text-anchor="end">
      <text x="518" y="178">0 m</text>
      <text x="518" y="230">1 m</text>
      <text x="518" y="282">2 m</text>
      <text x="518" y="334">3 m</text>
      <text x="518" y="386">4 m</text>
    </g>

    <!-- body -->
    <g fill="#A9713F" stroke="#6B4A32" stroke-width="1">
      <circle cx="424" cy="270" r="10"/>
      <rect x="366" y="262" width="48" height="17" rx="8"/>
      <rect x="332" y="266" width="38" height="9" rx="4"/>
      <rect x="378" y="279" width="28" height="6" rx="3"/>
    </g>
    <path d="M414 263 L 414 277" stroke="#6B4A32" stroke-width="2"/>
    <path d="M418 263 L 430 263" stroke="#6B4A32" stroke-width="2"/>

    <g font-family="Georgia, serif" font-size="9" fill="#F3EEE4">
      <text x="330" y="322">body at 2–3 m / 尸体位于 2–3 米</text>
    </g>
    <path d="M390 312 L 408 284" stroke="#F3EEE4" stroke-width="1"/>

    <g font-family="Georgia, serif" font-size="9" fill="#3F3626">
      <text x="242" y="145">sphagnum / 泥炭藓</text>
      <text x="430" y="145">water table / 水位线</text>
    </g>
    <text x="440" y="205" font-family="Georgia, serif" font-size="9" fill="#F3EEE4">peat / 泥炭层</text>
    <path d="M300 148 L 268 156" stroke="#3F3626" stroke-width="1"/>
    <path d="M470 148 V 173" stroke="#3F3626" stroke-width="1"/>
  </g>

  <g>
    <rect x="600" y="112" width="240" height="280" fill="#EFE6D6"/>
    <text x="620" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">WHY IT PRESERVES / 为什么能保存</text>

    <g fill="#4F6B3A">
      <circle cx="624" cy="174" r="3"/>
      <circle cx="624" cy="226" r="3"/>
      <circle cx="624" cy="278" r="3"/>
      <circle cx="624" cy="330" r="3"/>
    </g>

    <g font-family="Georgia, serif">
      <text x="640" y="178" font-size="10" fill="#1D1A17">LOW OXYGEN / 缺氧</text>
      <text x="640" y="192" font-size="9" fill="#6B6256">bacteria cannot work / 细菌无法分解</text>

      <text x="640" y="230" font-size="10" fill="#1D1A17">ACID / 酸性</text>
      <text x="640" y="244" font-size="9" fill="#6B6256">pH around 3–4 / pH 约 3–4</text>

      <text x="640" y="282" font-size="10" fill="#1D1A17">COLD / 低温</text>
      <text x="640" y="296" font-size="9" fill="#6B6256">decay slows down / 腐烂极慢</text>

      <text x="640" y="334" font-size="10" fill="#1D1A17">SPHAGNUM / 泥炭藓</text>
      <text x="640" y="348" font-size="9" fill="#6B6256">sphagnan suppresses microbes</text>
      <text x="640" y="360" font-size="9" fill="#6B6256">抑制微生物</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Skin, hair, and stomach contents can survive for millennia.</text>
    <text x="60" y="470">皮肤、头发和胃里的食物可以保存数千年。</text>
    <text x="60" y="494" fill="#B44A32">The cause of death is often clear; the reason for deposition is not. / 死因往往清楚，为什么放进沼泽却没有定论。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
