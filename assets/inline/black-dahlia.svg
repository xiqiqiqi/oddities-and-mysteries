<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Black Dahlia: the January 1947 timeline, the press and the suspects</title>
  <desc id="desc">A five-stage timeline from Elizabeth Short's last sighting to the 2003 book, with panels on the case and on the suspects.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE BLACK DAHLIA · LOS ANGELES, 1947</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">ELIZABETH SHORT / THE PRESS / AN OPEN CASE</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="132" font-family="Georgia, serif" font-size="8" fill="#6B6256">FIVE DATES / 五个日期</text>

    <path d="M95 160 V 340" stroke="#8C7A52" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="95" cy="160" r="3.5"/>
      <circle cx="95" cy="205" r="3.5"/>
      <circle cx="95" cy="250" r="3.5"/>
      <circle cx="95" cy="295" r="3.5"/>
      <circle cx="95" cy="340" r="3.5"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="115" y="160">9 JAN 1947 · LAST SEEN / 最后目击</text>
      <text x="115" y="205">15 JAN 1947 · THE LOT / 空地</text>
      <text x="115" y="250">16 JAN · THE PRESS / 报纸</text>
      <text x="115" y="295">1947–49 · INVESTIGATION / 调查</text>
      <text x="115" y="340">2003 · THE BOOK / 一本书</text>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="115" y="175">洛杉矶市中心，伊丽莎白·肖特</text>
      <text x="115" y="220">南诺顿大道 3800 街区，尸体被移动</text>
      <text x="115" y="265">“黑色大丽花”，头版与假供词</text>
      <text x="115" y="310">问询 150 多名嫌疑人，未起诉</text>
      <text x="115" y="355">霍德尔指认父亲，警方未采纳</text>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CASE / 案件</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">Elizabeth Short, 22 / 二十二岁</text>
      <text x="520" y="186">Medford, Massachusetts → Los Angeles</text>
      <text x="520" y="204">body moved / 尸体被移动</text>
      <text x="520" y="222">no blood at the lot / 现场没有血迹</text>
      <text x="520" y="240">the first scene was never found</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE SUSPECTS / 嫌疑人</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">Robert Manley / 曼利，已排除</text>
      <text x="520" y="330">George Hodel / 霍德尔，有争议</text>
      <text x="520" y="348">150+ interviewed / 问询一百五十多人</text>
      <text x="520" y="366">no conviction / 无人被定罪</text>
      <text x="520" y="382">the case remains open / 案件仍未结</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Elizabeth Short was last seen on 9 January 1947; her body was found on 15 January.</text>
    <text x="60" y="470">伊丽莎白·肖特 1947 年 1 月 9 日最后被看见，1 月 15 日尸体被发现。</text>
    <text x="60" y="494" fill="#B44A32">The case is still open; no suspect has ever been convicted. / 案件至今未结，没有嫌疑人被定罪。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
