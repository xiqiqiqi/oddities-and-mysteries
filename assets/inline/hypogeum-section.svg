<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Hal Saflieni Hypogeum: three cut levels and the winter solstice light</title>
  <desc id="desc">A schematic section: a street-level facade above ground; below it three levels of rock-cut chambers connected by steps and openings, the upper level earliest (Temple Period), lower levels later; red ochre spiral motifs on a ceiling; a beam of winter-solstice light entering from the original surface opening onto the Holy of Holies facade; notes that the site was cut with antler, flint, chert and obsidian and holds remains of about 7000 people.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
  <text x="60" y="62" font-family="Georgia, serif" font-size="26" fill="#1D1A17">ĦAL SAFLIENI · THREE LEVELS</text>
  <text x="60" y="86" font-family="Georgia, serif" font-size="12" fill="#6B6256">地下三层与冬至的光 · cut levels and solstice light</text>

  <g>
    <rect x="60" y="112" width="500" height="300" fill="#EFE6D6"/>
    <path d="M60 150 H 560" stroke="#6B4A32" stroke-width="2"/>
    <rect x="80" y="122" width="120" height="28" fill="#D8CCB6" stroke="#6B4A32"/>
    <text x="86" y="140" font-family="Georgia, serif" font-size="9" fill="#1D1A17">街面入口 / street facade</text>
    <path d="M140 150 V 190" stroke="#6B4A32" stroke-width="1.4" stroke-dasharray="4 3"/>
    <g fill="#E4D8C2" stroke="#6B4A32" stroke-width="1.2">
      <path d="M90 190 h 120 v 40 h -120 z"/>
      <path d="M240 195 h 90 v 35 h -90 z"/>
      <path d="M360 190 h 110 v 40 h -110 z"/>
      <path d="M110 260 h 100 v 40 h -100 z"/>
      <path d="M250 265 h 120 v 40 h -120 z"/>
      <path d="M400 260 h 90 v 40 h -90 z"/>
      <path d="M150 330 h 110 v 40 h -110 z"/>
      <path d="M300 335 h 130 v 40 h -130 z"/>
    </g>
    <text x="90" y="182" font-family="Georgia, serif" font-size="9" fill="#4A4030">上层（最早）/ upper, earliest</text>
    <text x="110" y="252" font-family="Georgia, serif" font-size="9" fill="#4A4030">中层 / middle</text>
    <text x="150" y="322" font-family="Georgia, serif" font-size="9" fill="#4A4030">下层（最晚）/ lower, latest</text>
    <path d="M470 150 L 430 330" stroke="#B44A32" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M430 330 l 6 -12 M430 330 l -8 -10" stroke="#B44A32" stroke-width="1.6"/>
    <text x="440" y="200" font-family="Georgia, serif" font-size="9" fill="#B44A32">冬至光 / solstice light</text>
    <g stroke="#B44A32" fill="none" stroke-width="1.4">
      <path d="M270 205 c 8 -8 16 0 8 8 c -8 8 -16 0 -8 -8"/>
      <path d="M300 210 c 6 -6 12 0 6 6 c -6 6 -12 0 -6 -6"/>
    </g>
    <text x="250" y="232" font-family="Georgia, serif" font-size="8" fill="#6B6256">红赭石螺旋 / red ochre spirals</text>
  </g>

  <g font-family="Georgia, serif">
    <rect x="590" y="112" width="250" height="300" fill="#EFE6D6"/>
    <text x="610" y="140" font-size="10" fill="#1D1A17">要点 / KEY FACTS</text>
    <g font-size="9" fill="#4A4030">
      <text x="610" y="166">约公元前 4000–2500 年使用</text>
      <text x="610" y="184">c. 4000–2500 BC in use</text>
      <text x="610" y="210">约 7000 人遗骸</text>
      <text x="610" y="228">remains of ~7,000 people</text>
      <text x="610" y="254">鹿角、燧石与黑曜石开凿</text>
      <text x="610" y="272">cut with antler, flint and obsidian</text>
      <text x="610" y="298">1980 年列入世界遗产</text>
      <text x="610" y="316">World Heritage since 1980</text>
      <text x="610" y="342">每日限 80 人</text>
      <text x="610" y="360">80 visitors per day</text>
    </g>
    <text x="610" y="392" font-size="8" fill="#B44A32">示意，非测绘图 / schematic, not a survey</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">上层墓室属神庙期早期，下层较晚；地面圣所被毁后，地下结构反而被掩藏数千年。</text>
    <text x="60" y="474" fill="#B44A32">"至圣所"的朝向使冬至光从原开口照到其立面。/ The Holy of Holies faces the winter-solstice light.</text>
  </g>
</svg>