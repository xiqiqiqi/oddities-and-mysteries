<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The layout of Angkor Wat and the water system of Angkor</title>
  <desc id="desc">A schematic plan of Angkor Wat with its moat, causeway, galleries, and five towers, and a schematic of the reservoirs, canals, temple, and Tonle Sap lake.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">ANGKOR WAT · LAYOUT</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">TEMPLE / WATER SYSTEM / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="460" height="280" fill="#EFE6D6"/>

    <!-- moat -->
    <rect x="80" y="130" width="420" height="245" fill="#C9DEE6" stroke="#6FA8C8" stroke-width="1.5"/>

    <!-- enclosure -->
    <rect x="115" y="160" width="350" height="185" fill="#E2DCC8" stroke="#8C7A52" stroke-width="1.5"/>

    <!-- causeway -->
    <rect x="80" y="238" width="35" height="18" fill="#D9C6A5" stroke="#8C7A52" stroke-width="1"/>
    <rect x="115" y="241" width="105" height="12" fill="#D9C6A5" stroke="#8C7A52" stroke-width="1"/>

    <!-- galleries -->
    <rect x="220" y="210" width="140" height="100" fill="none" stroke="#8C7A52" stroke-width="1.2"/>
    <rect x="250" y="240" width="80" height="40" fill="none" stroke="#8C7A52" stroke-width="1.2"/>

    <!-- five towers -->
    <g fill="#D9C6A5" stroke="#6B4A32" stroke-width="1.2">
      <rect x="270" y="250" width="40" height="20"/>
      <rect x="278" y="228" width="24" height="22"/>
      <rect x="285" y="205" width="10" height="23"/>
      <rect x="233" y="240" width="14" height="12"/>
      <rect x="333" y="240" width="14" height="12"/>
      <rect x="233" y="280" width="14" height="12"/>
      <rect x="333" y="280" width="14" height="12"/>
    </g>
    <g fill="none" stroke="#6B4A32" stroke-width="1">
      <path d="M285 205 L 290 198 L 295 205"/>
      <path d="M233 240 L 240 234 L 247 240"/>
      <path d="M333 240 L 340 234 L 347 240"/>
      <path d="M233 280 L 240 274 L 247 280"/>
      <path d="M333 280 L 340 274 L 347 280"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="88" y="124">moat / 护城河</text>
      <text x="120" y="232">causeway / 参道</text>
      <text x="360" y="200">five towers / 五塔</text>
      <text x="360" y="330">gallery / 回廊</text>
    </g>
    <path d="M96 128 L 96 145" stroke="#1D1A17" stroke-width="1"/>
    <path d="M200 236 L 216 245" stroke="#1D1A17" stroke-width="1"/>
    <path d="M358 204 L 312 216" stroke="#1D1A17" stroke-width="1"/>
    <path d="M358 326 L 346 300" stroke="#1D1A17" stroke-width="1"/>

    <g font-family="Georgia, serif" font-size="8" fill="#6B6256">
      <text x="68" y="380">W</text>
      <text x="502" y="380">E</text>
      <text x="220" y="380">temple faces west / 庙门朝西</text>
    </g>
  </g>

  <g>
    <rect x="550" y="112" width="290" height="280" fill="#EFE6D6"/>
    <text x="570" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">WATER CITY / 水城</text>

    <rect x="580" y="190" width="100" height="70" fill="#C9DEE6" stroke="#6FA8C8" stroke-width="1.2"/>
    <text x="580" y="182" font-family="Georgia, serif" font-size="8" fill="#4A6B7A">baray / 水库</text>

    <rect x="560" y="330" width="270" height="50" fill="#C9DEE6"/>
    <text x="570" y="356" font-family="Georgia, serif" font-size="8" fill="#4A6B7A">TONLE SAP / 洞里萨湖</text>

    <g fill="#D9C6A5" stroke="#6B4A32" stroke-width="1">
      <rect x="722" y="258" width="36" height="16"/>
      <rect x="730" y="246" width="20" height="12"/>
      <rect x="737" y="236" width="6" height="10"/>
    </g>

    <g stroke="#6FA8C8" stroke-width="2" fill="none">
      <path d="M680 225 L 722 250"/>
      <path d="M740 274 V 330"/>
    </g>

    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="690" y="300">canals / 渠道</text>
      <text x="770" y="240">temple / 寺庙</text>
    </g>

    <text x="570" y="306" font-family="Georgia, serif" font-size="8" fill="#6B6256">water stored, then released</text>
    <text x="570" y="318" font-family="Georgia, serif" font-size="8" fill="#6B6256">雨季蓄水，旱季放水</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The temple is surrounded by a moat about 190 metres wide.</text>
    <text x="60" y="470">寺庙被一条宽约 190 米的护城河围住。</text>
    <text x="60" y="494" fill="#B44A32">Angkor was a city of reservoirs and canals, not just a temple. / 吴哥不只有寺庙，还有水库和渠道组成的城市。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
