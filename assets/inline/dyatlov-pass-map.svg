<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Schematic of the Dyatlov Pass site</title>
  <desc id="desc">A schematic slope showing the tent, footprints leading downhill to a cedar, and the ravine where the last bodies were found.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">DYATLOV PASS · 1959</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">KHOLAT SYAKHL / SCHEMATIC, NOT A SURVEY</text>

  <rect x="60" y="112" width="780" height="300" fill="#DCE6E8"/>
  <g stroke="#8FA0B0" stroke-width="1" fill="none" opacity=".35">
    <path d="M60 180 C 180 160, 260 200, 380 180 S 620 150, 840 180"/>
    <path d="M60 240 C 180 220, 260 260, 380 240 S 620 210, 840 240"/>
    <path d="M60 300 C 180 280, 260 320, 380 300 S 620 270, 840 300"/>
    <path d="M60 360 C 180 340, 260 380, 380 360 S 620 330, 840 360"/>
  </g>

  <g>
    <path d="M190 200 L 250 200 L 240 232 L 200 232 Z" fill="#3E4A52" stroke="#1D1A17" stroke-width="2"/>
    <path d="M220 200 L 220 232" stroke="#F3EEE4" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M238 206 L 250 214" stroke="#B44A32" stroke-width="2"/>
    <text x="160" y="188" font-family="Georgia, serif" font-size="11" fill="#1D1A17">TENT / 帐篷</text>
    <text x="160" y="252" font-family="Georgia, serif" font-size="10" fill="#B44A32">cut from inside / 从里面割开</text>
  </g>

  <g stroke="#B44A32" stroke-width="2" stroke-dasharray="5 6" fill="none">
    <path d="M240 232 C 280 260, 330 300, 390 330 S 470 360, 510 360"/>
  </g>
  <g fill="#B44A32">
    <path d="M510 360 L 498 354 M510 360 L 498 366" stroke="#B44A32" stroke-width="2" fill="none"/>
  </g>
  <text x="300" y="286" font-family="Georgia, serif" font-size="10" fill="#B44A32">FOOTPRINTS / 脚印</text>

  <g>
    <path d="M520 330 L 520 300 M520 310 L 500 292 M520 316 L 540 298" stroke="#4F6B3A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="520" cy="294" r="16" fill="#4F6B3A" opacity=".8"/>
    <text x="500" y="386" font-family="Georgia, serif" font-size="11" fill="#1D1A17">CEDAR / 雪松</text>
    <text x="486" y="402" font-family="Georgia, serif" font-size="10" fill="#6B6256">2 bodies / 2 具遗体</text>
  </g>

  <g>
    <path d="M650 330 C 680 310, 740 310, 780 330 L 760 370 C 720 380, 690 380, 660 370 Z" fill="#8FA0B0" opacity=".5"/>
    <text x="666" y="352" font-family="Georgia, serif" font-size="11" fill="#1D1A17">RAVINE / 山沟</text>
    <text x="666" y="368" font-family="Georgia, serif" font-size="10" fill="#6B6256">4 bodies, May / 5 月发现 4 具</text>
  </g>

  <g fill="#1D1A17">
    <circle cx="420" cy="322" r="4"/>
    <circle cx="450" cy="336" r="4"/>
    <circle cx="480" cy="348" r="4"/>
  </g>
  <text x="286" y="314" font-family="Georgia, serif" font-size="10" fill="#6B6256">3 BODIES</text>
  <text x="286" y="330" font-family="Georgia, serif" font-size="10" fill="#6B6256">帐篷与雪松之间</text>

  <g font-family="Georgia, serif" font-size="11" fill="#6B6256">
    <text x="60" y="444">FEB 1 · camp / 扎营</text>
    <text x="250" y="444">FEB 26 · tent found / 发现帐篷</text>
    <text x="510" y="444">MAY · ravine bodies found / 山沟遗体发现</text>
    <text x="60" y="478">Avalanche is the leading explanation; the scene is still debated.</text>
    <text x="60" y="496">雪崩是目前最主流的解释；现场细节仍有争议。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
