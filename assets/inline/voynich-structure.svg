<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Structure of the Voynich manuscript</title>
  <desc id="desc">A schematic of the manuscript's main sections and a timeline from its radiocarbon date to its arrival at Yale.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">VOYNICH MANUSCRIPT · STRUCTURE</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">SECTIONS / PROVENANCE / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="250" height="300" fill="#EFE6D6" stroke="#6B4A32" stroke-width="1.5"/>
    <rect x="310" y="112" width="250" height="300" fill="#EFE6D6" stroke="#6B4A32" stroke-width="1.5"/>
    <path d="M310 112 L 310 412" stroke="#6B4A32" stroke-width="2"/>

    <g font-family="Georgia, serif" font-size="10" fill="#1D1A17">
      <text x="80" y="136">BOTANICAL / 植物</text>
      <text x="330" y="136">ASTRONOMICAL / 天文</text>
      <text x="80" y="286">BATHING / 浴场</text>
      <text x="330" y="286">PHARMACEUTICAL / 药房</text>
    </g>

    <g stroke="#4F6B3A" stroke-width="2" fill="none">
      <path d="M120 230 L 120 170 M120 190 L 104 174 M120 204 L 138 186"/>
      <path d="M104 174 C 96 166, 104 158, 112 166 M138 186 C 146 178, 154 186, 146 194"/>
      <path d="M180 240 L 180 180 M180 200 L 164 184 M180 214 L 198 196"/>
    </g>
    <g stroke="#6B6256" stroke-width="1" fill="none" opacity=".7">
      <path d="M92 252 H 204 M92 260 H 196 M92 268 H 200"/>
    </g>

    <g stroke="#1D1A17" stroke-width="1.5" fill="none">
      <circle cx="430" cy="190" r="42"/>
      <circle cx="430" cy="190" r="28"/>
      <path d="M430 148 L 430 232 M388 190 L 472 190"/>
      <path d="M430 160 L 438 178 L 456 180 L 442 192 L 446 210 L 430 200 L 414 210 L 418 192 L 404 180 L 422 178 Z" fill="#D99A2B" opacity=".7"/>
    </g>
    <text x="330" y="252" font-family="Georgia, serif" font-size="9" fill="#6B6256">zodiac / 黄道</text>

    <g stroke="#6FA8C8" stroke-width="2" fill="none">
      <path d="M80 340 C 120 320, 160 360, 200 340 S 280 320, 300 340"/>
      <path d="M80 372 C 120 352, 160 392, 200 372 S 280 352, 300 372"/>
    </g>
    <g fill="#B44A32">
      <circle cx="120" cy="356" r="3"/>
      <circle cx="160" cy="366" r="3"/>
      <circle cx="210" cy="354" r="3"/>
      <circle cx="260" cy="366" r="3"/>
    </g>
    <text x="80" y="398" font-family="Georgia, serif" font-size="9" fill="#6B6256">figures in pools / 池中人物</text>

    <g fill="#D99A2B" stroke="#6B4A32" stroke-width="1">
      <path d="M340 342 L 360 330 L 372 344 L 368 372 L 344 372 Z"/>
      <path d="M382 348 L 398 336 L 410 350 L 406 372 L 386 372 Z"/>
      <path d="M418 338 L 438 332 L 448 346 L 444 370 L 422 370 Z"/>
    </g>
    <text x="330" y="398" font-family="Georgia, serif" font-size="9" fill="#6B6256">jars / 药罐</text>
  </g>

  <g>
    <text x="600" y="136" font-family="Georgia, serif" font-size="11" fill="#1D1A17">TIMELINE / 时间线</text>
    <path d="M610 230 L 610 400" stroke="#1D1A17" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="610" cy="230" r="5"/>
      <circle cx="610" cy="286" r="5"/>
      <circle cx="610" cy="342" r="5"/>
      <circle cx="610" cy="398" r="5"/>
    </g>
    <g font-family="Georgia, serif" font-size="10" fill="#1D1A17">
      <text x="626" y="226">1404–1438 · vellum / 羊皮纸</text>
      <text x="626" y="282">1665 · letter mentions Rudolf II</text>
      <text x="626" y="298" font-size="9" fill="#6B6256">信件提到鲁道夫二世</text>
      <text x="626" y="338">1912 · Voynich buys it</text>
      <text x="626" y="354" font-size="9" fill="#6B6256">伏尼契购得</text>
      <text x="626" y="394">1969 · Yale, MS 408</text>
      <text x="626" y="410" font-size="9" fill="#6B6256">耶鲁大学收藏</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Approx. 240 surviving pages; sections overlap and some pages are missing.</text>
    <text x="60" y="470">现存约 240 页；分区有交叉，部分页面缺失。</text>
    <text x="60" y="494" fill="#B44A32">No accepted full decipherment. / 尚无被学界接受的完整破译。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
