<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Affair of the Diamond Necklace: the fraud in five moves</title>
  <desc id="desc">A five-step timeline of the fraud, with panels on the necklace and on the verdict of 1786.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE QUEEN'S NECKLACE · 1784–1786</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">NECKLACE / FORGED LETTER / MIDNIGHT MEETING</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="132" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE FRAUD IN FIVE MOVES / 骗局的五个步骤</text>

    <!-- spine -->
    <path d="M95 158 V 358" stroke="#8C7A52" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="95" cy="158" r="3.5"/>
      <circle cx="95" cy="208" r="3.5"/>
      <circle cx="95" cy="258" r="3.5"/>
      <circle cx="95" cy="308" r="3.5"/>
      <circle cx="95" cy="358" r="3.5"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="115" y="158">1 · JEWELLERS / 珠宝商</text>
      <text x="115" y="208">2 · JEANNE DE LA MOTTE / 让娜</text>
      <text x="115" y="258">3 · CARDINAL ROHAN / 罗昂枢机</text>
      <text x="115" y="308">4 · NICOLE D'OLIVA / 妮科尔</text>
      <text x="115" y="358">5 · LONDON / 伦敦</text>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="115" y="173">项链标价 200 万里弗，王后拒买</text>
      <text x="115" y="223">自称王后的密友，提出做中间人</text>
      <text x="115" y="273">签下分期票据，把项链交给“信使”</text>
      <text x="115" y="323">午夜在花园假扮王后，递上伪造信件</text>
      <text x="115" y="373">项链拆散，钻石出现在伦敦市场</text>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE NECKLACE / 项链</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">647 diamonds, c. 2,800 carats</text>
      <text x="520" y="184">647 颗钻石，约 2,800 克拉</text>
      <text x="520" y="204">2,000,000 livres / 两百万里弗</text>
      <text x="520" y="222">made for Du Barry, never delivered</text>
      <text x="520" y="238">为杜巴利夫人定做，未能交付</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE VERDICT / 判决</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">Rohan acquitted / 罗昂无罪</text>
      <text x="520" y="332">Jeanne: whipping, branding, prison</text>
      <text x="520" y="348">让娜：鞭刑、烙刑、终身监禁</text>
      <text x="520" y="368">the Queen's name damaged / 王后名声受损</text>
      <text x="520" y="384">1789: the Revolution / 1789 年革命</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The necklace was made for Louis XV's mistress and never reached her.</text>
    <text x="60" y="470">项链原本为路易十五的情妇定做，还没交付，国王就死了。</text>
    <text x="60" y="494" fill="#B44A32">The Queen never bought it, but the trial damaged her name. / 王后从未买过这条项链，但审判毁了她的名声。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
