<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The He Shi Bi: from a stone in Jingshan to the imperial seal</title>
  <desc id="desc">A five-stage timeline from Bian He's discovery in Jingshan to the legendary imperial seal, with panels on the story and on the seal.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE JADE IN THE STONE · 和氏璧</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">BIAN HE / THE STATE OF ZHAO / THE IMPERIAL SEAL</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="132" font-family="Georgia, serif" font-size="8" fill="#6B6256">FIVE STAGES / 五个阶段</text>

    <path d="M95 160 V 340" stroke="#8C7A52" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="95" cy="160" r="3.5"/>
      <circle cx="95" cy="205" r="3.5"/>
      <circle cx="95" cy="250" r="3.5"/>
      <circle cx="95" cy="295" r="3.5"/>
      <circle cx="95" cy="340" r="3.5"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="115" y="160">SPRING &amp; AUTUMN · JINGSHAN / 荆山</text>
      <text x="115" y="205">WARRING STATES · ZHAO / 赵国</text>
      <text x="115" y="250">QIN OFFERS 15 CITIES / 十五城</text>
      <text x="115" y="295">228 BCE · QIN TAKES ZHAO</text>
      <text x="115" y="340">221 BCE · THE SEAL / 玉玺</text>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="115" y="175">卞和献玉，两脚被砍</text>
      <text x="115" y="220">缪贤买璧，赵王占有</text>
      <text x="115" y="265">蔺相如完璧归赵</text>
      <text x="115" y="310">秦灭赵，和氏璧落入秦国</text>
      <text x="115" y="355">传说李斯刻下八字</text>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE STORY / 故事</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">a stone that looked ordinary</text>
      <text x="520" y="182">一块看起来普通的石头</text>
      <text x="520" y="202">two kings, two feet / 两代楚王，两只脚</text>
      <text x="520" y="222">the third king cut it open</text>
      <text x="520" y="238">第三位楚王剖开石头，里面是玉</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE SEAL / 玉玺</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">“受命于天，既寿永昌”</text>
      <text x="520" y="330">Wang Mang's aunt threw it / 王政君摔缺一角</text>
      <text x="520" y="348">repaired with gold / 金镶玉</text>
      <text x="520" y="366">lost after 936 / 936 年后失踪</text>
      <text x="520" y="382">authenticity unknown / 真伪无定论</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The story of Bian He is told in the Han Feizi; the diplomacy is in the Records of the Grand Historian.</text>
    <text x="60" y="470">卞和的故事见于《韩非子》，完璧归赵见于《史记》。</text>
    <text x="60" y="494" fill="#B44A32">The jade has not survived; its use for the imperial seal is a later tradition. / 和氏璧没有留存，“以璧制玺”是后世的说法。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
