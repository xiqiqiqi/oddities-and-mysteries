<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The curse of Tutankhamun: discovery, death, and the newspapers</title>
  <desc id="desc">A five-date timeline from the discovery of the tomb in 1922 to Carter's death in 1939, with panels on the tomb and on the curse story.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">THE CURSE OF TUTANKHAMUN · 1922–1939</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">KV62 / CARNARVON / THE NEWSPAPERS</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>
    <text x="80" y="132" font-family="Georgia, serif" font-size="8" fill="#6B6256">THE CASE IN FIVE DATES / 五个日期</text>

    <path d="M95 158 V 358" stroke="#8C7A52" stroke-width="1.5"/>
    <g fill="#B44A32">
      <circle cx="95" cy="158" r="3.5"/>
      <circle cx="95" cy="208" r="3.5"/>
      <circle cx="95" cy="258" r="3.5"/>
      <circle cx="95" cy="308" r="3.5"/>
      <circle cx="95" cy="358" r="3.5"/>
    </g>

    <g font-family="Georgia, serif" font-size="9" fill="#1D1A17">
      <text x="115" y="158">4 NOV 1922 · THE STEP / 第一级台阶</text>
      <text x="115" y="208">26 NOV 1922 · THE DOOR / 墓门</text>
      <text x="115" y="258">5 APR 1923 · CARNARVON / 卡纳冯</text>
      <text x="115" y="308">1923–28 · THE LIST / 名单</text>
      <text x="115" y="358">1939 · CARTER / 卡特</text>
    </g>
    <g font-family="Georgia, serif" font-size="8" fill="#4A4030">
      <text x="115" y="173">卡特在帝王谷挖到一级台阶</text>
      <text x="115" y="223">蜡烛伸进小洞：“了不起的东西”</text>
      <text x="115" y="273">蚊虫叮咬、感染、肺炎，五十六岁</text>
      <text x="115" y="323">几名参观者与参与者相继去世</text>
      <text x="115" y="373">六十四岁，死于淋巴瘤</text>
    </g>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE TOMB / 陵墓</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">KV62, Valley of the Kings / 帝王谷</text>
      <text x="520" y="186">antechamber + burial chamber</text>
      <text x="520" y="202">前室与墓室，空间很小</text>
      <text x="520" y="222">5,398 objects / 五千多件随葬品</text>
      <text x="520" y="240">gold mask / 黄金面具</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CURSE / 诅咒</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">no curse inscription / 墓中没有诅咒铭文</text>
      <text x="520" y="332">the line came from the press / 那句话是报纸编的</text>
      <text x="520" y="352">Carnarvon died of infection / 卡纳冯死于感染</text>
      <text x="520" y="372">death rate not higher / 死亡率并不更高</text>
    </g>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">Carter opened the tomb on 26 November 1922.</text>
    <text x="60" y="470">1922 年 11 月 26 日，卡特把蜡烛伸进墓门上的小洞。</text>
    <text x="60" y="494" fill="#B44A32">No curse inscription was found; the story was created by the newspapers. / 墓中没有诅咒铭文，这个故事是报纸造出来的。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
