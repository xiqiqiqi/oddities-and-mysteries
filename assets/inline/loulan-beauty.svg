<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The Loulan Beauty: the Lop Nur find and the clothing</title>
  <desc id="desc">A schematic map of Lop Nur with the Tieban River cemetery and the Loulan site, and panels on the 1980 discovery and the clothing found with the mummy.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">LOULAN BEAUTY · c. 1800 BCE</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">LOP NUR / DISCOVERY / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>

    <!-- basin -->
    <ellipse cx="290" cy="255" rx="95" ry="65" fill="#E2DCC8" stroke="#8C7A52" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="250" y="258" font-family="Georgia, serif" font-size="9" fill="#4A4030">LOP NUR / 罗布泊</text>

    <!-- rivers -->
    <g fill="none" stroke="#6FA8C8" stroke-width="2">
      <path d="M80 180 Q 140 185 180 200 Q 220 215 240 230"/>
      <path d="M80 230 Q 130 225 170 235 Q 200 242 230 248"/>
    </g>
    <text x="90" y="172" font-family="Georgia, serif" font-size="8" fill="#3E5A5A">TIEBAN RIVER / 铁板河</text>

    <!-- cemetery -->
    <circle cx="245" cy="225" r="4" fill="#B44A32"/>
    <text x="120" y="262" font-family="Georgia, serif" font-size="8" fill="#1D1A17">cemetery / 墓地</text>
    <path d="M190 258 L 240 228" stroke="#1D1A17" stroke-width="1"/>

    <!-- Loulan -->
    <rect x="330" y="278" width="12" height="10" fill="#8C7A52" stroke="#4A4030" stroke-width="1"/>
    <text x="348" y="288" font-family="Georgia, serif" font-size="8" fill="#1D1A17">LOULAN / 楼兰</text>

    <path d="M430 140 L 436 156 L 430 152 L 424 156 Z" fill="#4A4030"/>
    <text x="426" y="136" font-family="Georgia, serif" font-size="8" fill="#4A4030">N</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE FINDS / 发现</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="166">1980: Mu Shunying's team</text>
      <text x="520" y="179">1980 年：穆舜英带队</text>
      <text x="520" y="201">female, ~45, 1.57 m</text>
      <text x="520" y="214">女性，约 45 岁，1.57 米</text>
      <text x="520" y="236">~3,800 years old / 约 3800 年</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE CLOTHING / 衣物</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">woolen hat with feather / 带羽毛的毛织帽</text>
      <text x="520" y="334">coarse woolen blanket / 粗毛毯</text>
      <text x="520" y="356">leather boots / 皮革靴子</text>
    </g>
    <text x="520" y="380" font-family="Georgia, serif" font-size="8" fill="#B44A32">name popularised by Japanese media</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The mummy was found at the Tieban River in 1980.</text>
    <text x="60" y="470">1980 年，干尸在铁板河被发现。</text>
    <text x="60" y="494" fill="#B44A32">She lived about 3,800 years ago, before the city of Loulan flourished. / 她生活在约 3800 年前，早于楼兰古城的繁盛期。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
