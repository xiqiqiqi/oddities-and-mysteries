<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Great Zimbabwe: the Hill Complex, the Great Enclosure, and the trade network</title>
  <desc id="desc">A schematic site plan with the Hill Complex, the Great Enclosure and its conical tower, the Valley Complex, and panels on the dry-stone walls and the Indian Ocean trade.</desc>
  <rect width="900" height="520" fill="#F3EEE4"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="26" fill="#1D1A17">GREAT ZIMBABWE · c. 1100–1450</text>
  <text x="60" y="80" font-family="Georgia, serif" font-size="12" fill="#6B6256">STONE / TRADE / SCHEMATIC</text>

  <g>
    <rect x="60" y="112" width="420" height="280" fill="#EFE6D6"/>

    <!-- hill -->
    <path d="M80 230 Q 120 150 200 170 Q 250 180 250 230 Q 170 250 80 230 Z" fill="#D8CCB6" stroke="#8C7A52" stroke-width="1.5"/>
    <text x="90" y="160" font-family="Georgia, serif" font-size="8" fill="#1D1A17">HILL COMPLEX / 山丘建筑群</text>

    <!-- great enclosure -->
    <ellipse cx="270" cy="300" rx="90" ry="55" fill="none" stroke="#8C7A52" stroke-width="8"/>
    <ellipse cx="270" cy="300" rx="90" ry="55" fill="none" stroke="#6B4A32" stroke-width="1.5"/>
    <path d="M270 285 L 280 300 L 270 315 L 260 300 Z" fill="#8C7A52" stroke="#4A4030" stroke-width="1"/>
    <text x="300" y="372" font-family="Georgia, serif" font-size="8" fill="#1D1A17">GREAT ENCLOSURE / 大围场</text>

    <!-- valley -->
    <g fill="#D9C6A5" stroke="#8C7A52" stroke-width="1">
      <rect x="120" y="330" width="18" height="12"/>
      <rect x="146" y="338" width="14" height="10"/>
      <rect x="170" y="330" width="16" height="12"/>
    </g>
    <text x="110" y="372" font-family="Georgia, serif" font-size="8" fill="#1D1A17">VALLEY COMPLEX / 谷地建筑群</text>
    <path d="M300 366 L 290 350" stroke="#1D1A17" stroke-width="1"/>

    <path d="M430 140 L 436 156 L 430 152 L 424 156 Z" fill="#4A4030"/>
    <text x="426" y="136" font-family="Georgia, serif" font-size="8" fill="#4A4030">N</text>
  </g>

  <g>
    <rect x="500" y="112" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="140" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE WALLS / 石墙</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="168">dry stone, no mortar</text>
      <text x="520" y="181">干砌，无灰浆</text>
      <text x="520" y="205">Great Enclosure: ~250 m around</text>
      <text x="520" y="218">大围场：周长约 250 米</text>
      <text x="520" y="238">up to 11 m high / 最高超过 11 米</text>
    </g>
  </g>

  <g>
    <rect x="500" y="258" width="340" height="134" fill="#EFE6D6"/>
    <text x="520" y="286" font-family="Georgia, serif" font-size="10" fill="#1D1A17">THE TRADE / 贸易</text>
    <g font-family="Georgia, serif" font-size="9" fill="#4A4030">
      <text x="520" y="312">gold, ivory, copper / 黄金、象牙、铜</text>
      <text x="520" y="334">Arab glass, Persian pottery, Chinese porcelain</text>
      <text x="520" y="347">阿拉伯玻璃、波斯陶器、中国瓷器</text>
      <text x="520" y="369">Indian Ocean routes / 印度洋商路</text>
    </g>
    <text x="520" y="386" font-family="Georgia, serif" font-size="8" fill="#B44A32">colonial claims denied African builders</text>
  </g>

  <g font-family="Georgia, serif" font-size="10" fill="#6B6256">
    <text x="60" y="452">The walls were built of granite blocks without mortar.</text>
    <text x="60" y="470">墙用花岗岩石块干砌，没有灰浆。</text>
    <text x="60" y="494" fill="#B44A32">Colonial writers attributed it to Phoenicians or the Queen of Sheba. / 殖民时期作家把它说成腓尼基人或示巴女王所建。</text>
  </g>
  <text x="60" y="30" font-family="Georgia, serif" font-size="11" fill="#6B6256">Graphic: XIQIQI · CC BY-SA 4.0</text>
</svg>
